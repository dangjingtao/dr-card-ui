# Managed public-repository copy of sanchuang-dev/.github's External Worker.
# Public callers cannot reuse private workflows; keep core behavior aligned with Organization source.
# Manual dispatch runs on default branch main; code edits and Draft PRs target dev.
name: Sanchuang Web Worker (DeepSeek Free)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to implement in dr-card-web
        required: true
        type: number

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      worker_branch: ${{ steps.identity.outputs.worker_branch }}
      pull_request_url: ${{ steps.pr.outputs.url }}

    steps:
      - name: Validate Sanchuang caller and work item
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          test "${GITHUB_REPOSITORY_OWNER}" = "sanchuang-dev"

          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          test "$(jq -r '.state' <<< "$issue_json")" = "open"

          if jq -e '.pull_request != null' <<< "$issue_json" >/dev/null; then
            echo "Issue #${ISSUE_NUMBER} resolves to a pull request, not a work-item Issue." >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/sanchuang-worker"
          printf '%s\n' "$issue_json" > "${RUNNER_TEMP}/sanchuang-worker/issue.json"

          comments_pages="${RUNNER_TEMP}/sanchuang-worker/issue-comments-pages.json"
          comments_json="${RUNNER_TEMP}/sanchuang-worker/issue-comments.json"
          trusted_comments="${RUNNER_TEMP}/sanchuang-worker/maintainer-comments.json"
          trusted_logins="${RUNNER_TEMP}/sanchuang-worker/trusted-commenters.txt"

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" > "$comments_pages"
          jq '[.[][]]' "$comments_pages" > "$comments_json"
          : > "$trusted_logins"

          while IFS= read -r login; do
            test -n "$login" || continue

            user_type="$(jq -r --arg login "$login" '[.[] | select(.user.login == $login) | .user.type][0] // ""' "$comments_json")"
            test "$user_type" != "Bot" || continue

            if permission_json="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" 2>/dev/null)"; then
              permission="$(jq -r '.permission // ""' <<< "$permission_json")"
            else
              echo "::warning::Ignoring Issue comments from @${login}: repository permission could not be verified."
              continue
            fi

            case "$permission" in
              admin|maintain|write)
                printf '%s\n' "$login" >> "$trusted_logins"
                ;;
            esac
          done < <(jq -r '.[].user.login' "$comments_json" | sort -u)

          jq --rawfile trusted "$trusted_logins" '
            ($trusted | split("\n") | map(select(length > 0))) as $trusted_logins
            | [
                .[]
                | select(.user.type != "Bot")
                | select(.user.login as $login | ($trusted_logins | index($login)) != null)
                | {
                    id,
                    author: .user.login,
                    created_at,
                    body: (.body // "")
                  }
              ]
            | sort_by(.created_at, .id)
          ' "$comments_json" > "$trusted_comments"

      - name: Checkout explicit delivery base
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Establish immutable execution identity
        id: identity
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: dev
        run: |
          set -euo pipefail

          git check-ref-format "refs/heads/${BASE_BRANCH}"

          base_sha="$(git rev-parse HEAD)"
          worker_branch="feat/worker-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format --branch "$worker_branch"

          git switch -c "$worker_branch"

          maintainer_comment_count="$(jq 'length' "${RUNNER_TEMP}/sanchuang-worker/maintainer-comments.json")"

          run_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > "${RUNNER_TEMP}/sanchuang-worker/identity.txt" <<EOF
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_started_at=${run_started_at}
          repository=${GITHUB_REPOSITORY}
          issue=${ISSUE_NUMBER}
          base_branch=${BASE_BRANCH}
          base_sha=${base_sha}
          worker_branch=${worker_branch}
          opencode_version=1.18.34
          trusted_maintainer_comments=${maintainer_comment_count}
          EOF

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "worker_branch=$worker_branch" >> "$GITHUB_OUTPUT"

      - name: Resolve run-scoped Worker provider route
        id: provider
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PROVIDER: opencode
          REQUESTED_MODEL: deepseek-v4.1-flash-free
          PROVIDER_PROFILE: ''
          PROVIDER_REGISTRY_REF: ''
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/sanchuang-worker"
          provider="${REQUESTED_PROVIDER:-opencode}"
          model="${REQUESTED_MODEL:-deepseek-v4.1-flash-free}"
          profile="${PROVIDER_PROFILE:-}"
          registry_ref="${PROVIDER_REGISTRY_REF:-}"

          # Narrow this deployment to the verified Zen free route; no paid fallback.
          if test "$provider" != "opencode" || test "$model" != "deepseek-v4.1-flash-free" || test -n "$profile" || test -n "$registry_ref"; then
            echo "::error::Only opencode/deepseek-v4.1-flash-free without a provider profile is authorized." >&2
            exit 1
          fi

          if [[ ! "$provider" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid provider identifier '${provider}'." >&2
            exit 1
          fi
          if [[ ! "$model" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]*$ || "$model" == */ || "$model" == *//* ]]; then
            echo "::error::Invalid model identifier '${model}'." >&2
            exit 1
          fi

          provider_config='{}'
          effective_registry_ref='builtin'
          provider_registry_sha='none'

          if test -n "$profile"; then
            if [[ ! "$profile" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::Invalid provider profile '${profile}'." >&2
              exit 1
            fi
            if [[ ! "$registry_ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::provider_profile requires an immutable 40-character provider_registry_ref." >&2
              exit 1
            fi

            registry_file="${root}/provider-registry.json"
            registry_path=".github/sanchuang-external-worker-providers.json"
            provider_registry_sha="$(gh api "repos/sanchuang-dev/.github/commits/${registry_ref}" --jq '.sha')"
            test "$provider_registry_sha" = "$registry_ref"

            registry_content="$(gh api "repos/sanchuang-dev/.github/contents/${registry_path}?ref=${registry_ref}" --jq '.content')"
            printf '%s' "$registry_content" | tr -d '\n' | base64 --decode > "$registry_file"
            test -s "$registry_file"

            jq -e '.schema_version == 1 and (.profiles | type == "object")' "$registry_file" >/dev/null

            profile_provider="$(jq -r --arg profile "$profile" '.profiles[$profile].provider_id // ""' "$registry_file")"
            if test -z "$profile_provider"; then
              echo "::error::Unknown provider profile '${profile}'." >&2
              exit 1
            fi
            if test "$profile_provider" != "$provider"; then
              echo "::error::Provider '${provider}' does not match profile '${profile}' provider_id '${profile_provider}'." >&2
              exit 1
            fi

            if ! jq -e --arg profile "$profile" --arg model "$model" '
              (.profiles[$profile].config | type == "object")
              and (.profiles[$profile].config.npm | type == "string")
              and (.profiles[$profile].config.npm | length > 0)
              and (
                (.profiles[$profile].config.options.baseURL // "") == ""
                or (.profiles[$profile].config.options.baseURL | test("^https://"))
              )
              and (.profiles[$profile].config.models | type == "object")
              and (.profiles[$profile].config.models | has($model))
            ' "$registry_file" >/dev/null; then
              echo "::error::Provider profile '${profile}' does not allow model '${model}' or has invalid config." >&2
              exit 1
            fi

            provider_config="$(jq -c --arg provider "$provider" --arg profile "$profile"               '{($provider): (.profiles[$profile].config // {})}' "$registry_file")"
            effective_registry_ref="$registry_ref"
          else
            if test "$provider" != "opencode"; then
              echo "::error::Provider '${provider}' requires a frozen provider_profile." >&2
              exit 1
            fi
          fi

          model_route="${provider}/${model}"

          jq -n             --arg provider "$provider"             --arg model "$model"             --arg model_route "$model_route"             --arg provider_profile "$profile"             --arg provider_registry_ref "$effective_registry_ref"             --arg provider_registry_sha "$provider_registry_sha"             --argjson provider_config "$provider_config"             '{
              provider: $provider,
              model: $model,
              model_route: $model_route,
              provider_profile: $provider_profile,
              provider_registry_ref: $provider_registry_ref,
              provider_registry_sha: $provider_registry_sha,
              provider_config: $provider_config
            }' > "${root}/provider-route.json"

          {
            echo "provider=${provider}"
            echo "provider_profile=${profile}"
            echo "provider_registry_ref=${effective_registry_ref}"
            echo "provider_registry_sha=${provider_registry_sha}"
            echo "model=${model}"
            echo "model_route=${model_route}"
          } >> "${root}/identity.txt"

          echo "provider=${provider}" >> "$GITHUB_OUTPUT"
          echo "provider_profile=${profile}" >> "$GITHUB_OUTPUT"
          echo "provider_registry_ref=${effective_registry_ref}" >> "$GITHUB_OUTPUT"
          echo "provider_registry_sha=${provider_registry_sha}" >> "$GITHUB_OUTPUT"
          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "model_route=${model_route}" >> "$GITHUB_OUTPUT"

      - name: Load current Organization policy and pinned Skill
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SANCHUANG_ORG_POLICY_READ_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.agents/skills/execute-work-item"

          test -n "${GH_TOKEN:-}" || { echo "::error::Organization policy read token is required."; exit 1; }
          policy_revision="$(gh api "repos/sanchuang-dev/.github/commits/main" --jq '.sha')"
          test -n "$policy_revision"
          printf 'skill_commit=%s\n' "$policy_revision" >> "${RUNNER_TEMP}/sanchuang-worker/identity.txt"

          gh api "repos/sanchuang-dev/.github/contents/AGENTS.md?ref=${policy_revision}"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "${RUNNER_TEMP}/sanchuang-worker/org-AGENTS.md"

          gh api "repos/sanchuang-dev/.github/contents/skills/execute-work-item/SKILL.md?ref=${policy_revision}"             --jq '.content'             | tr -d '\n'             | base64 --decode             > "${HOME}/.agents/skills/execute-work-item/SKILL.md"

          test -s "${RUNNER_TEMP}/sanchuang-worker/org-AGENTS.md"
          test -s "${HOME}/.agents/skills/execute-work-item/SKILL.md"
          test -s AGENTS.md

      - name: Install pinned OpenCode CLI
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.34
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(opencode --version)" = "1.18.34"

      - name: Run bounded external Worker
        id: worker
        shell: bash
        env:
          PROVIDER: ${{ steps.provider.outputs.provider }}
          MODEL_ROUTE: ${{ steps.provider.outputs.model_route }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_DISABLE_AUTOUPDATE: "1"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
          NO_COLOR: "1"
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: dev
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
        run: |
          set -euo pipefail

          route="${RUNNER_TEMP}/sanchuang-worker/provider-route.json"
          test -s "$route"

          if test "$PROVIDER" = "opencode" && test -z "${PROVIDER_API_KEY:-}"; then
            provider_key="${OPENCODE_API_KEY:-}"
          else
            provider_key="${PROVIDER_API_KEY:-}"
          fi
          if test -z "$provider_key"; then
            echo "::error::No credential available for provider '${PROVIDER}'." >&2
            exit 1
          fi

          export OPENCODE_AUTH_CONTENT
          # $provider and $key below are jq variables, not shell variables.
          # shellcheck disable=SC2016
          OPENCODE_AUTH_CONTENT="$(jq -cn --arg provider "$PROVIDER" --arg key "$provider_key" '{($provider):{"type":"api","key":$key}}')"
          unset OPENCODE_API_KEY PROVIDER_API_KEY provider_key

          export OPENCODE_CONFIG_CONTENT
          OPENCODE_CONFIG_CONTENT="$(
            jq -cn --slurpfile route "$route" '
              {
                "share": "disabled",
                "autoupdate": false,
                "permission": {
                  "read": "allow",
                  "glob": "allow",
                  "grep": "allow",
                  "list": "allow",
                  "skill": "allow",
                  "edit": "allow",
                  "write": "allow",
                  "bash": "allow",
                  "task": "deny",
                  "webfetch": "allow",
                  "websearch": "allow",
                  "question": "deny",
                  "external_directory": "deny"
                }
              }
              + (if (($route[0].provider_config // {}) | length) == 0 then {}
                 else {"provider": $route[0].provider_config}
                 end)
            '
          )"

          issue_title="$(jq -r '.title' "${RUNNER_TEMP}/sanchuang-worker/issue.json")"
          issue_body="$(jq -r '.body // ""' "${RUNNER_TEMP}/sanchuang-worker/issue.json")"
          maintainer_amendments="$(jq -r '
            if length == 0 then
              "(none)"
            else
              map(
                "COMMENT #\(.id) by @\(.author) at \(.created_at)\n\(.body)"
              )
              | join("\n\n---\n\n")
            end
          ' "${RUNNER_TEMP}/sanchuang-worker/maintainer-comments.json")"
          org_policy="$(cat "${RUNNER_TEMP}/sanchuang-worker/org-AGENTS.md")"

          cat > "${RUNNER_TEMP}/sanchuang-worker/prompt.txt" <<PROMPT
          You are the implementation Worker for exactly one explicitly authorized Sanchuang engineering work item.

          Control hierarchy for this run:
          1. The maintainer authorized implementation of the assigned Issue.
          2. The current Sanchuang Organization policy below applies.
          3. The repository root AGENTS.md in the checked-out workspace applies.
          4. The execute-work-item Skill is installed and MUST be loaded with OpenCode's native skill tool before editing.
          5. The exact GitHub Issue title/body below is the base work-item contract.
          6. Trusted maintainer follow-up comments below are chronological follow-up context. A comment is eligible only when its author is a human account with current repository write, maintain, or admin permission; bot and ordinary-user comments are excluded. Only an eligible comment that explicitly clarifies, revises, returns, narrows, or otherwise changes the work item acts as a contract amendment. Status/evidence/conversational comments do not change the contract. When explicit amendments conflict, later trusted amendments override earlier trusted amendments and the conflicting part of the base Issue contract. The loaded execute-work-item Skill defines the full amendment semantics; apply it.

          Immutable execution identity:
          - repository: ${GITHUB_REPOSITORY}
          - issue: #${ISSUE_NUMBER}
          - delivery base: ${BASE_BRANCH}
          - base SHA: ${BASE_SHA}

          Important execution constraints:
          - Work only on this Issue.
          - Only supplied eligible trusted maintainer follow-up comments (human authors with current repository write, maintain, or admin permission) can amend the Issue contract, and only when their wording explicitly changes or clarifies the work item. Ordinary acknowledgements, status notes, evidence chatter, or conversational comments do not amend it.
          - Other Issue comments are deliberately excluded and have no authority in this run.
          - Explicit trusted amendments can change implementation scope/acceptance within this Issue, but they do not expand this Worker's authority to merge, close/reopen Issues, release, deploy, or promote environments.
          - Read repository AGENTS.md before editing.
          - Load execute-work-item before editing.
          - Repository read/search/edit/write and shell/terminal are allowed on this ephemeral GitHub-hosted runner for inspecting the code, installing dependencies, running tests/builds, and local debugging. Record commands and results truthfully.
          - Shell/network permission is not authority to push, create/merge PRs, modify unrelated repository or workflow files, deploy, or change secrets. Do not read, log, transmit, or persist credentials/tokens from environment or configuration, including via outbound network requests. Trusted post-run verification and GitHub delivery steps remain authoritative.
          - Web fetch/search and ordinary internet requests are allowed for project documentation, dependencies, research, and implementation. No artificial request-count or usage quota is imposed by this Worker workflow; external service limits, provider availability, and GitHub-hosted runner limits still apply.
          - Subagents and GitHub mutations are unavailable to the Worker as dedicated tools.
          - Do not create commits, branches, pull requests, Issues, releases, or environment promotions.
          - You may run tests, builds, and diagnostics in the Worker runner and report their exact results. The separate trusted post-run verification is still required; your own passing tests do not replace it.
          - If the Issue cannot be implemented safely without a maintainer decision or broader scope, make no speculative workaround and report the blocker.
          - Make the smallest coherent change that satisfies the Issue contract.
          - End with a concise handoff listing changed surfaces, reasoning, and any validation gap.

          CURRENT_SANCHUANG_ORGANIZATION_POLICY
          ${org_policy}

          ASSIGNED_ISSUE_BASE_CONTRACT
          Title: ${issue_title}

          ${issue_body}

          TRUSTED_MAINTAINER_FOLLOW_UP
          ${maintainer_amendments}
          PROMPT

          opencode session list --max-count 50 --format json > "${RUNNER_TEMP}/sanchuang-worker/sessions-before.json" 2>/dev/null || printf '[]\n' > "${RUNNER_TEMP}/sanchuang-worker/sessions-before.json"

          set +e
          opencode run             --model "$MODEL_ROUTE"             --agent build             --title "Sanchuang external Worker #${ISSUE_NUMBER}"             "$(cat "${RUNNER_TEMP}/sanchuang-worker/prompt.txt")"             2>&1 | tee "${RUNNER_TEMP}/sanchuang-worker/worker-output.raw"
          worker_rc="${PIPESTATUS[0]}"
          set -e

          python3 - <<'PY'
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "sanchuang-worker"
          src = root / "worker-output.raw"
          dst = root / "worker-output.txt"
          limit = 120_000
          data = src.read_bytes() if src.exists() else b""
          truncated = len(data) > limit
          dst.write_bytes(data[:limit] + (b"\n[truncated]\n" if truncated else b""))
          (root / "worker-output-meta.json").write_text(
              __import__("json").dumps({"bytes": len(data), "limit_bytes": limit, "truncated": truncated}) + "\n"
          )
          PY

          opencode session list --max-count 50 --format json > "${RUNNER_TEMP}/sanchuang-worker/sessions-after.json" 2>/dev/null || printf '[]\n' > "${RUNNER_TEMP}/sanchuang-worker/sessions-after.json"

          export OPENCODE_SESSION_ID
          OPENCODE_SESSION_ID="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "sanchuang-worker"

          def ids(path):
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  return []
              if isinstance(value, dict):
                  value = value.get("sessions", value.get("data", []))
              if not isinstance(value, list):
                  return []
              out = []
              for item in value:
                  if not isinstance(item, dict):
                      continue
                  sid = item.get("id") or item.get("sessionID") or item.get("session_id")
                  if isinstance(sid, str):
                      out.append(sid)
              return out

          before = set(ids(root / "sessions-before.json"))
          after = ids(root / "sessions-after.json")
          fresh = [sid for sid in after if sid not in before]
          print((fresh or after or [""])[0])
          PY
          )"

          if test -n "$OPENCODE_SESSION_ID"; then
            if opencode export "$OPENCODE_SESSION_ID" --sanitize > "${RUNNER_TEMP}/sanchuang-worker/session-export.json" 2>/dev/null \
              || opencode session export "$OPENCODE_SESSION_ID" --sanitize > "${RUNNER_TEMP}/sanchuang-worker/session-export.json" 2>/dev/null; then
              python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sanchuang-worker"
          src = root / "session-export.json"
          out = root / "trajectory.jsonl"
          summary = root / "session-summary.json"
          limit_events = 500

          try:
              data = json.loads(src.read_text(errors="replace"))
          except Exception as exc:
              summary.write_text(json.dumps({"available": False, "error": type(exc).__name__}) + "\n")
              out.write_text("")
              raise SystemExit(0)

          session = data.get("info", {}) if isinstance(data, dict) else {}
          messages = data.get("messages", []) if isinstance(data, dict) else []
          if not isinstance(messages, list):
              messages = []

          events = []
          for msg in messages:
              if not isinstance(msg, dict):
                  continue
              info = msg.get("info", msg)
              if not isinstance(info, dict):
                  info = {}
              mid = info.get("id")
              sid = info.get("sessionID") or session.get("id")
              role = info.get("role")
              parts = msg.get("parts", info.get("parts", []))
              if not isinstance(parts, list):
                  parts = []
              for part in parts:
                  if not isinstance(part, dict):
                      continue
                  kind = part.get("type")
                  if kind == "tool":
                      state = part.get("state", {})
                      if not isinstance(state, dict):
                          state = {}
                      timing = state.get("time", {})
                      if not isinstance(timing, dict):
                          timing = {}
                      events.append({
                          "kind": "tool",
                          "session_id": sid,
                          "message_id": mid,
                          "role": role,
                          "tool": part.get("tool") or part.get("toolName"),
                          "call_id": part.get("callID") or part.get("toolCallId"),
                          "status": state.get("status") or part.get("state"),
                          "started_at": timing.get("start"),
                          "ended_at": timing.get("end"),
                      })
                  elif kind in {"step-start", "step-finish", "patch", "retry", "compaction", "subtask"}:
                      events.append({
                          "kind": kind,
                          "session_id": sid,
                          "message_id": mid,
                          "role": role,
                      })

          truncated = len(events) > limit_events
          events = events[:limit_events]
          with out.open("w") as fh:
              for event in events:
                  fh.write(json.dumps(event, separators=(",", ":")) + "\n")

          summary.write_text(json.dumps({
              "available": True,
              "session_id": session.get("id") or os.environ.get("OPENCODE_SESSION_ID"),
              "event_count": len(events),
              "event_limit": limit_events,
              "truncated": truncated,
              "content_policy": "metadata-only; prompt/text/reasoning/tool inputs/tool outputs omitted",
          }, separators=(",", ":")) + "\n")
          PY
              rm -f "${RUNNER_TEMP}/sanchuang-worker/session-export.json"
            else
              printf '{"available":false,"reason":"sanitized_export_unavailable"}\n' > "${RUNNER_TEMP}/sanchuang-worker/session-summary.json"
              : > "${RUNNER_TEMP}/sanchuang-worker/trajectory.jsonl"
            fi
          else
            printf '{"available":false,"reason":"session_id_unresolved"}\n' > "${RUNNER_TEMP}/sanchuang-worker/session-summary.json"
            : > "${RUNNER_TEMP}/sanchuang-worker/trajectory.jsonl"
          fi

          exit "$worker_rc"

      - name: Require a bounded implementation change
        id: bounded
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "Worker produced no implementation changes." >&2
            exit 1
          fi

          git diff --check

      - name: Run trusted repository verification
        id: verify
        shell: bash
        env:
          SANCHUANG_VERIFICATION_COMMAND: "npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test && npm run build:dev"
        run: |
          set -euo pipefail
          test -n "${SANCHUANG_VERIFICATION_COMMAND}"

          set +e
          {
            echo "$ ${SANCHUANG_VERIFICATION_COMMAND}"
            bash -lc "${SANCHUANG_VERIFICATION_COMMAND}"
          } 2>&1 | tee "${RUNNER_TEMP}/sanchuang-worker/verification.raw"
          verification_rc="${PIPESTATUS[0]}"
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path(os.environ["RUNNER_TEMP"]) / "sanchuang-worker"
          src = root / "verification.raw"
          dst = root / "verification.log"
          limit = 120_000
          data = src.read_bytes() if src.exists() else b""
          truncated = len(data) > limit
          dst.write_bytes(data[:limit] + (b"\n[truncated]\n" if truncated else b""))
          (root / "verification-meta.json").write_text(
              json.dumps({"bytes": len(data), "limit_bytes": limit, "truncated": truncated}) + "\n"
          )
          PY

          exit "$verification_rc"

      - name: Commit and push isolated worker branch
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
        run: |
          set -euo pipefail

          git config user.name "sanchuang-agent-worker[bot]"
          git config user.email "sanchuang-agent-worker[bot]@users.noreply.github.com"
          git add -A
          git commit -m "agent: implement issue #${ISSUE_NUMBER}"

          gh auth setup-git
          git push --set-upstream origin "HEAD:${WORKER_BRANCH}"

      - name: Create Draft PR with durable handoff
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: dev
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          PROVIDER_PROFILE: ${{ steps.provider.outputs.provider_profile }}
          PROVIDER_REGISTRY_REF: ${{ steps.provider.outputs.provider_registry_ref }}
          MODEL_ROUTE: ${{ steps.provider.outputs.model_route }}
          VERIFICATION_COMMAND: "npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test && npm run build:dev"
        run: |
          set -euo pipefail

          export ISSUE_TITLE
          ISSUE_TITLE="$(jq -r '.title' "${RUNNER_TEMP}/sanchuang-worker/issue.json" | cut -c1-220)"

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sanchuang-worker"
          worker_output = (root / "worker-output.txt").read_text(errors="replace")[:12000]
          verification_output = (root / "verification.log").read_text(errors="replace")[:12000]

          body = f"""## Sanchuang external Worker handoff

          - Work item: #{os.environ["ISSUE_NUMBER"]} — {os.environ["ISSUE_TITLE"]}
          - Delivery base: `{os.environ["BASE_BRANCH"]}`
          - Base SHA: `{os.environ["BASE_SHA"]}`
          - Worker branch: `{os.environ["WORKER_BRANCH"]}`
          - Worker harness: OpenCode CLI 1.18.34
          - Provider: `{os.environ["PROVIDER"]}`
          - Provider profile: `{os.environ["PROVIDER_PROFILE"] or "builtin"}`
          - Provider registry revision: `{os.environ["PROVIDER_REGISTRY_REF"]}`
          - Model route: `{os.environ["MODEL_ROUTE"]}`
          - Portable Skill: `execute-work-item@current-org-main`
          - Verification: PASS
          - Verification command: `{os.environ["VERIFICATION_COMMAND"]}`

          This PR is intentionally **Draft**. Worker execution does not grant merge, Issue acceptance/closure, environment promotion, release, or deployment authority.

          <details>
          <summary>Worker handoff</summary>

          <pre>
          {worker_output}
          </pre>
          </details>

          <details>
          <summary>Verification output</summary>

          <pre>
          {verification_output}
          </pre>
          </details>
          """
          (root / "pr-body.md").write_text(body)
          PY

          pr_url="$(gh pr create             --draft             --base "$BASE_BRANCH"             --head "$WORKER_BRANCH"             --title "agent: #${ISSUE_NUMBER} ${ISSUE_TITLE}"             --body-file "${RUNNER_TEMP}/sanchuang-worker/pr-body.md")"

          test -n "$pr_url"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Verify Draft PR boundary
        id: boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          BASE_BRANCH: dev
          WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "$PR_URL" --json isDraft,baseRefName,headRefName,state)"
          test "$(jq -r '.isDraft' <<< "$pr_json")" = "true"
          test "$(jq -r '.baseRefName' <<< "$pr_json")" = "$BASE_BRANCH"
          test "$(jq -r '.headRefName' <<< "$pr_json")" = "$WORKER_BRANCH"
          test "$(jq -r '.state' <<< "$pr_json")" = "OPEN"

      - name: Finalize structured Worker evidence
        id: evidence
        if: always()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: dev
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          WORKER_BRANCH: ${{ steps.identity.outputs.worker_branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
          VERIFICATION_COMMAND: "npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm test && npm run build:dev"
          REQUESTED_PROVIDER: opencode
          REQUESTED_MODEL: deepseek-v4.1-flash-free
          REQUESTED_PROVIDER_PROFILE: ''
          REQUESTED_PROVIDER_REGISTRY_REF: ''
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
          BOUNDED_OUTCOME: ${{ steps.bounded.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/sanchuang-worker"
          mkdir -p "$root"

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git status --short > "$root/changed-files.txt" || true
            if test -n "${BASE_SHA:-}" && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git diff --name-status "${BASE_SHA}"...HEAD > "$root/committed-files.txt" || true
              git diff --stat "${BASE_SHA}"...HEAD > "$root/diff-stat.txt" || true
            else
              git diff --name-status > "$root/committed-files.txt" || true
              git diff --stat > "$root/diff-stat.txt" || true
            fi
          fi

          export TERMINAL_STATUS FAILURE_STAGE
          read -r TERMINAL_STATUS FAILURE_STAGE < <(python3 - <<'PY'
          import os
          stages = [
              ("validate", os.getenv("VALIDATE_OUTCOME")),
              ("checkout", os.getenv("CHECKOUT_OUTCOME")),
              ("identity", os.getenv("IDENTITY_OUTCOME")),
              ("provider", os.getenv("PROVIDER_OUTCOME")),
              ("policy", os.getenv("POLICY_OUTCOME")),
              ("install", os.getenv("INSTALL_OUTCOME")),
              ("version", os.getenv("VERSION_OUTCOME")),
              ("worker", os.getenv("WORKER_OUTCOME")),
              ("bounded_change", os.getenv("BOUNDED_OUTCOME")),
              ("trusted_verification", os.getenv("VERIFY_OUTCOME")),
              ("commit_push", os.getenv("COMMIT_OUTCOME")),
              ("draft_pr", os.getenv("PR_OUTCOME")),
              ("draft_pr_boundary", os.getenv("BOUNDARY_OUTCOME")),
          ]
          failed = next((name for name, outcome in stages if outcome == "failure"), "")
          terminal = "failure" if failed else ("success" if all(outcome in {"success", "skipped"} for _, outcome in stages) else "incomplete")
          print(terminal, failed or "none")
          PY
          )

          export RUN_ENDED_AT
          RUN_ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export COMMIT_SHA
          COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "sanchuang-worker"
          identity = {}
          p = root / "identity.txt"
          if p.exists():
              for line in p.read_text(errors="replace").splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      identity[k.strip()] = v.strip()

          stages = {
              "validate": os.getenv("VALIDATE_OUTCOME"),
              "checkout": os.getenv("CHECKOUT_OUTCOME"),
              "identity": os.getenv("IDENTITY_OUTCOME"),
              "provider": os.getenv("PROVIDER_OUTCOME"),
              "policy": os.getenv("POLICY_OUTCOME"),
              "install": os.getenv("INSTALL_OUTCOME"),
              "version": os.getenv("VERSION_OUTCOME"),
              "worker": os.getenv("WORKER_OUTCOME"),
              "bounded_change": os.getenv("BOUNDED_OUTCOME"),
              "trusted_verification": os.getenv("VERIFY_OUTCOME"),
              "commit_push": os.getenv("COMMIT_OUTCOME"),
              "draft_pr": os.getenv("PR_OUTCOME"),
              "draft_pr_boundary": os.getenv("BOUNDARY_OUTCOME"),
          }

          session = {}
          sp = root / "session-summary.json"
          if sp.exists():
              try:
                  session = json.loads(sp.read_text())
              except Exception:
                  session = {"available": False, "reason": "invalid_session_summary"}

          payload = {
              "schema_version": 1,
              "run_id": identity.get("run_id") or os.getenv("GITHUB_RUN_ID"),
              "run_attempt": identity.get("run_attempt") or os.getenv("GITHUB_RUN_ATTEMPT"),
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "issue_number": int(os.getenv("ISSUE_NUMBER")) if os.getenv("ISSUE_NUMBER") else None,
              "base_branch": os.getenv("BASE_BRANCH"),
              "base_sha": os.getenv("BASE_SHA") or identity.get("base_sha"),
              "worker_branch": os.getenv("WORKER_BRANCH") or identity.get("worker_branch"),
              "opencode_version": identity.get("opencode_version", "1.18.34"),
              "requested_provider": os.getenv("REQUESTED_PROVIDER") or "opencode",
              "requested_provider_profile": os.getenv("REQUESTED_PROVIDER_PROFILE") or None,
              "requested_provider_registry_ref": os.getenv("REQUESTED_PROVIDER_REGISTRY_REF") or None,
              "requested_model": os.getenv("REQUESTED_MODEL") or "deepseek-v4.1-flash-free",
              "provider": identity.get("provider"),
              "provider_profile": identity.get("provider_profile") or None,
              "provider_registry_ref": identity.get("provider_registry_ref"),
              "provider_registry_sha": identity.get("provider_registry_sha"),
              "model": identity.get("model"),
              "model_route": identity.get("model_route"),
              "skill_commit": identity.get("skill_commit"),
              "started_at": identity.get("run_started_at"),
              "ended_at": os.getenv("RUN_ENDED_AT"),
              "terminal_status": os.getenv("TERMINAL_STATUS"),
              "failure_stage": os.getenv("FAILURE_STAGE"),
              "stages": stages,
              "session": session,
              "commit_sha": os.getenv("COMMIT_SHA") if os.getenv("COMMIT_OUTCOME") == "success" else None,
              "draft_pr_url": os.getenv("PR_URL") or None,
              "verification": {
                  "command": (os.getenv("VERIFICATION_COMMAND") or "")[:4000],
                  "outcome": os.getenv("VERIFY_OUTCOME"),
              },
              "artifact_retention_days": 14,
              "safety": {
                  "raw_environment_persisted": False,
                  "provider_credentials_persisted": False,
                  "provider_config_run_scoped": True,
                  "github_token_persisted": False,
                  "session_content_policy": "metadata-only trajectory; sanitized export removed after extraction",
                  "worker_output_limit_bytes": 120000,
                  "verification_output_limit_bytes": 120000,
              },
          }
          (root / "worker-run.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload Worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanchuang-external-worker-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sanchuang-worker/worker-run.json
            ${{ runner.temp }}/sanchuang-worker/trajectory.jsonl
            ${{ runner.temp }}/sanchuang-worker/session-summary.json
            ${{ runner.temp }}/sanchuang-worker/worker-output.txt
            ${{ runner.temp }}/sanchuang-worker/worker-output-meta.json
            ${{ runner.temp }}/sanchuang-worker/verification.log
            ${{ runner.temp }}/sanchuang-worker/verification-meta.json
            ${{ runner.temp }}/sanchuang-worker/changed-files.txt
            ${{ runner.temp }}/sanchuang-worker/committed-files.txt
            ${{ runner.temp }}/sanchuang-worker/diff-stat.txt
          if-no-files-found: warn
          retention-days: 14
