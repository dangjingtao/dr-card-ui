name: H007 lockfile generator

on:
  push:
    branches: [h007-http-error-foundation]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: h007-http-error-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate Axios manifests
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact axios@1.19.0
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          packageJson.scripts['verify:h007'] = 'node scripts/verify-h007-http.mjs'
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson)}\n`)
          NODE

      - name: Commit generated manifests and remove generator
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/h007-lockfile.yml
          git add package.json package-lock.json
          git commit -m 'build: add axios dependency for H007'
          git push origin HEAD:h007-http-error-foundation
