name: H007 lockfile generator

on:
  push:
    branches: [h007-http-error-foundation]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate Axios lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact axios@1.19.0

      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: h007-axios-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 1
