# Non-production, non-destructive OSS connectivity smoke.
# This runs only when THIS workflow is first promoted or changed on prod.
# It never deploys the application or modifies an existing release.
name: OSS Connection Smoke

on:
  push:
    branches: [prod]
    paths:
      - '.github/workflows/oss-connection-smoke.yml'

permissions:
  contents: read

concurrency:
  group: oss-connection-smoke
  cancel-in-progress: false

jobs:
  probe:
    name: Verify company OSS write/read without publishing H5
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oss-production
    env:
      OSS_REGION: cn-guangzhou
      OSS_ENDPOINT: https://oss-cn-guangzhou.aliyuncs.com
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Check supplied deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OSS_ACCESS_KEY_ID" || -z "$OSS_ACCESS_KEY_SECRET" ]]; then
            echo "::error::Missing OSS_ACCESS_KEY_ID or OSS_ACCESS_KEY_SECRET in oss-production environment"
            exit 1
          fi
      - name: Install verified Alibaba Cloud ossutil
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-install
          sudo install -m 755 /tmp/ossutil-install/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version
      - name: Upload, stat and read back an isolated proof object
        shell: bash
        run: |
          set -euo pipefail
          remote="oss://kbs-sdl/h5/releases/_ci-smoke/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}/proof.txt"
          printf 'oss-smoke run=%s attempt=%s commit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$RUNNER_TEMP/proof.txt"
          ossutil cp "$RUNNER_TEMP/proof.txt" "$remote"
          ossutil stat "$remote"
          ossutil cp "$remote" "$RUNNER_TEMP/proof-readback.txt"
          cmp "$RUNNER_TEMP/proof.txt" "$RUNNER_TEMP/proof-readback.txt"
          {
            echo "## OSS connectivity smoke passed"
            echo "Validated an isolated write, object metadata lookup and read-back."
            echo ""
            echo "Bucket: \`kbs-sdl\` (cn-guangzhou)"
            echo "Object: \`$remote\`"
            echo ""
            echo "No H5 bundle published, no files deleted, no domain or App entry changed."
          } >> "$GITHUB_STEP_SUMMARY"
