name: Build

on:
  push:
    branches: [preview, dev, test, prod, main]
  pull_request:
    branches: [preview, dev, test, prod, main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static hygiene
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Verify H007 HTTP foundation
        run: npm run verify:h007

      - name: Verify H009 runtime contracts
        run: npm run verify:h009

      - name: Verify H010 Zustand state
        run: npm run verify:h010

      - name: Verify H011 Storage Adapter
        run: npm run verify:h011

      - name: Verify H012 RHF + Zod forms
        run: npm run verify:h012

      - name: Verify H013 MSW network boundary
        run: npm run verify:h013

      - name: Verify H014 Mock scenarios
        run: npm run verify:h014

      - name: Verify H015 JSBridge boundary
        run: npm run verify:h015

      - name: Smoke test development server
        shell: bash
        run: |
          npm run dev -- --port 4174 > /tmp/dr-card-vite-dev.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:4174/mockServiceWorker.js > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dr-card-vite-dev.log
          exit 1

      - name: Build development bundle
        run: npm run build:dev

      - name: Verify development build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='dev'||m.dataMode!=='mock')process.exit(1)"
          test -f dist/mockServiceWorker.js

      - name: Verify local dev can explicitly use API
        shell: bash
        run: |
          VITE_DATA_MODE=api node scripts/build-h5.mjs dev --dry-run | tee /tmp/local-dev-api.txt
          grep -F '"appEnvironment":"dev"' /tmp/local-dev-api.txt
          grep -F '"dataMode":"api"' /tmp/local-dev-api.txt

      - name: Verify Cloudflare branch-to-mode policy
        shell: bash
        run: |
          CF_PAGES_BRANCH=feature/h006 CF_PAGES_COMMIT_SHA="$GITHUB_SHA" node scripts/build-h5.mjs cf --dry-run | tee /tmp/cf-feature-build.txt
          grep -F 'env=preview' /tmp/cf-feature-build.txt
          grep -F '"appEnvironment":"preview"' /tmp/cf-feature-build.txt
          grep -F '"dataMode":"mock"' /tmp/cf-feature-build.txt

          CF_PAGES_BRANCH=feature/h006 CF_PAGES_COMMIT_SHA="$GITHUB_SHA" node scripts/build-h5.mjs auto --dry-run | tee /tmp/cf-auto-build.txt
          grep -F '"appEnvironment":"preview"' /tmp/cf-auto-build.txt
          grep -F '"dataMode":"mock"' /tmp/cf-auto-build.txt

          if CF_PAGES_BRANCH=dev VITE_DATA_MODE=api node scripts/build-h5.mjs cf --dry-run; then
            echo 'Cloudflare dev accepted API mode; dev/preview Pages builds must be fixed Mock.'
            exit 1
          fi

          if CF_PAGES_BRANCH=main CF_PAGES_COMMIT_SHA="$GITHUB_SHA" node scripts/build-h5.mjs cf --dry-run; then
            echo 'main must not resolve to a deployable formal-H5 Cloudflare target.'
            exit 1
          fi

      - name: Build Cloudflare preview bundle
        run: CF_PAGES_BRANCH=preview CF_PAGES_COMMIT_SHA="$GITHUB_SHA" npm run build:cf

      - name: Verify Cloudflare preview build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='preview'||m.dataMode!=='mock'||m.build.sha!==process.env.GITHUB_SHA)process.exit(1)"
          test -f dist/mockServiceWorker.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Formal H5 browser regression
        id: formal-e2e
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/dr-card-playwright-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null; then
              npm run test:e2e:formal
              exit $?
            fi
            sleep 1
          done
          cat /tmp/dr-card-playwright-preview.log
          exit 1

      - name: Verify H019 evidence assembler
        if: always() && steps.formal-e2e.outcome != 'skipped'
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_PLAYWRIGHT_OUTCOME: ${{ steps.formal-e2e.outcome }}
          EVIDENCE_BRIDGE_STATUS: not verified — H015 real Native protocol is blocked
        run: |
          npm run report:evidence
          test -f test-evidence-site/latest/index.html
          test -f "test-evidence-site/commits/$GITHUB_SHA/summary.json"
          grep -F 'Browser CI evidence only' test-evidence-site/latest/index.html

      - name: Build test bundle
        run: npm run build:test

      - name: Verify test build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='test'||m.dataMode!=='api')process.exit(1)"
          test ! -f dist/mockServiceWorker.js

      - name: Reject Mock in production-like builds
        shell: bash
        run: |
          if VITE_DATA_MODE=mock node scripts/build-h5.mjs test --dry-run; then
            echo 'test accepted forbidden API Mock configuration.'
            exit 1
          fi
          if VITE_BRIDGE_MODE=mock node scripts/build-h5.mjs prod --dry-run; then
            echo 'prod accepted forbidden Bridge Mock configuration.'
            exit 1
          fi

      - name: Build production bundle
        run: npm run build:prod

      - name: Verify production build identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='prod'||m.dataMode!=='api'||m.build.sha!==process.env.GITHUB_SHA)process.exit(1)"
          test ! -f dist/mockServiceWorker.js

      - name: Verify Cloudflare SPA fallback asset
        run: test -f dist/_redirects && grep -F '/* /index.html 200' dist/_redirects

      - name: Smoke test production preview
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/dr-card-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:4173/profile > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dr-card-vite-preview.log
          exit 1

  test-gate:
    name: Test branch gate
    if: github.ref_name == 'test' || github.base_ref == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_APP_ENV: test
      VITE_DATA_MODE: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify test environment policy
        shell: bash
        run: |
          test "$VITE_APP_ENV" = "test"
          test "$VITE_DATA_MODE" = "api"
          test "$VITE_DATA_MODE" != "mock"

      - name: Build test bundle
        run: npm run build:test

      - name: Verify test bundle identity
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/build-meta.json','utf8'));if(m.appEnvironment!=='test'||m.dataMode!=='api')process.exit(1)"

      - name: Verify test bundle has no Mock Service Worker asset
        shell: bash
        run: |
          if find dist -type f -name 'mockServiceWorker.js' -print -quit | grep -q .; then
            echo 'Mock Service Worker asset must not be present in the test bundle.'
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore previous cumulative evidence site
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p test-evidence-site
          ARTIFACT_URL="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=h019-evidence-site&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].archive_download_url // empty')"
          if [ -z "$ARTIFACT_URL" ]; then
            echo 'No previous H019 site artifact found; starting a new evidence history.'
            exit 0
          fi
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$ARTIFACT_URL" \
            --output /tmp/h019-evidence-site.zip
          unzip -q -o /tmp/h019-evidence-site.zip -d test-evidence-site

      - name: Run production-like test browser gate
        id: test-playwright
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/dr-card-test-playwright.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/build-meta.json > /dev/null; then
              npm run test:e2e:test-gate
              exit $?
            fi
            sleep 1
          done

          cat /tmp/dr-card-test-playwright.log
          exit 1

      - name: Assemble H019 evidence site
        if: always()
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.sha }}
          EVIDENCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          EVIDENCE_REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_PLAYWRIGHT_OUTCOME: ${{ steps.test-playwright.outcome }}
          EVIDENCE_BRIDGE_STATUS: not verified — H015 real Native protocol is blocked
        run: npm run report:evidence

      - name: Write H019 Actions summary
        if: always()
        shell: bash
        run: |
          if [ -f test-evidence-site/summary.md ]; then
            cat test-evidence-site/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## H5 test evidence' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Evidence assembly did not produce summary.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw H019 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            playwright-report/
            test-results/
            dist/build-meta.json

      - name: Upload cumulative H019 evidence site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h019-evidence-site
          if-no-files-found: error
          retention-days: 30
          path: test-evidence-site/

      - name: Check independent evidence Pages configuration
        if: always()
        id: evidence-pages-config
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_TEST_EVIDENCE_PROJECT }}
        run: |
          if [ "$CF_PROJECT" = "dr-card-ui" ]; then
            echo '::warning::H019 refuses to deploy evidence into the formal dr-card-ui Pages project.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          elif [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_PROJECT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::H019 Cloudflare publish skipped: configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CF_TEST_EVIDENCE_PROJECT for a separate Pages project.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish independent H019 evidence Pages
        if: always() && steps.evidence-pages-config.outputs.ready == 'true'
        id: evidence-pages-deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy test-evidence-site --project-name=${{ vars.CF_TEST_EVIDENCE_PROJECT }} --branch=${{ vars.CF_TEST_EVIDENCE_BRANCH || 'main' }}

      - name: Record H019 publish status
        if: always()
        shell: bash
        env:
          CONFIG_READY: ${{ steps.evidence-pages-config.outputs.ready }}
          DEPLOY_OUTCOME: ${{ steps.evidence-pages-deploy.outcome }}
          CF_PROJECT: ${{ vars.CF_TEST_EVIDENCE_PROJECT }}
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Evidence delivery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw GitHub artifact: `h019-test-evidence-${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cumulative site artifact: `h019-evidence-site`' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONFIG_READY" != "true" ]; then
            echo '- Cloudflare Pages: skipped (independent evidence project is not fully configured).' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "- Cloudflare Pages: published to independent project \`$CF_PROJECT\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Cloudflare Pages: publish attempt did not succeed (outcome: \`${DEPLOY_OUTCOME:-unknown}\`); GitHub artifacts remain available." >> "$GITHUB_STEP_SUMMARY"
          fi
