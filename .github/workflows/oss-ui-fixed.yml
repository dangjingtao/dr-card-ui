name: OSS UI Fixed Path

on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview]

permissions:
  contents: read

concurrency:
  group: oss-ui-fixed
  cancel-in-progress: false

jobs:
  package-check:
    name: Verify independent preview UI package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-oss-ui.mjs
      - name: Verify fixed UI identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F '/kbs-web/ui/assets/' dist/index.html
          node - <<'NODE'
          const fs = require('node:fs')
          const m = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'))
          if (m.appEnvironment !== 'preview' || m.ossWeb?.target !== 'ui' || m.ossWeb?.path !== '/kbs-web/ui/') process.exit(1)
          NODE

  deploy:
    name: Publish preview to kbs-web/ui
    if: github.event_name == 'push' && github.ref_name == 'preview'
    needs: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OSS_REGION: cn-guangzhou
      OSS_ENDPOINT: https://oss-cn-guangzhou.aliyuncs.com
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require OSS credentials
        run: |
          set -euo pipefail
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build-oss-ui.mjs
      - name: Install verified ossutil
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-install
          sudo install -m 755 /tmp/ossutil-install/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
      - run: node scripts/deploy-oss-ui.mjs
      - name: Record UI publish
        run: |
          {
            echo '### UI fixed publish'
            echo 'OSS: `oss://kbs-sdl/kbs-web/ui/`'
            echo "Source: `$GITHUB_SHA` · Run: `$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT`"
            echo 'All files were read back; index.html was switched last; no OSS keys were deleted.'
          } >> "$GITHUB_STEP_SUMMARY"
