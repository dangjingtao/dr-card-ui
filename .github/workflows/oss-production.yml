name: OSS Production Package

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: oss-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-check:
    name: Verify production package (no cloud credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-only values. These must never be used for an actual OSS upload.
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_BUDDY_PUBLIC_ORIGIN: https://h5.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:prod
      - name: Verify distributable identity and artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const m = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'))
          if (m.appEnvironment !== 'prod' || m.dataMode !== 'api' || m.bridgeMode !== 'native' ||
              !m.apiBaseConfigured || !m.buddyPublicOriginConfigured) process.exit(1)
          NODE
          test -f dist/index.html
          test ! -f dist/mockServiceWorker.js
      - name: Verify nested artifact build independently of cloud upload
        env:
          H5_OSS_ARTIFACT: '1'
          VITE_ROUTER_BASENAME: /h5/releases/ci-package/1.1
        shell: bash
        run: |
          npm run build:prod
          node <<'NODE'
          const fs = require('node:fs')
          const html = fs.readFileSync('dist/index.html', 'utf8')
          if (!html.includes('src="./assets/') || !html.includes('href="./assets/')) {
            throw new Error('OSS package must use relative JS and CSS assets')
          }
          const basename = '/h5/releases/ci-package/1.1'
          const chunks = fs.readdirSync('dist/assets').filter(name => name.endsWith('.js'))
          if (!chunks.some(name => fs.readFileSync(`dist/assets/${name}`, 'utf8').includes(basename))) {
            throw new Error('OSS router basename not injected')
          }
          NODE

  upload-oss:
    name: Upload immutable H5 package to OSS (not site launch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: package-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Set protection and scoped secrets in GitHub Settings -> Environments.
    environment: oss-production
    env:
      OSS_REGION: cn-guangzhou
      OSS_ENDPOINT: https://oss-cn-guangzhou.aliyuncs.com
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      VITE_API_BASE_URL: ${{ vars.OSS_PROD_API_BASE_URL }}
      VITE_BUDDY_PUBLIC_ORIGIN: ${{ vars.OSS_PROD_PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check immutable artifact upload settings (not website go-live)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          [[ "$VITE_API_BASE_URL" == https://* ]]
          # Environment variables may contain accidental surrounding whitespace.
          # Normalize for the build; build-h5.mjs still validates the HTTPS origin.
          origin="$(node -e 'process.stdout.write(process.env.VITE_BUDDY_PUBLIC_ORIGIN.trim())')"
          [[ "$origin" == https://* ]]
          echo "VITE_BUDDY_PUBLIC_ORIGIN=$origin" >> "$GITHUB_ENV"
          if [[ "$origin" == *.aliyuncs.com ]]; then
            echo "::warning::Default OSS Bucket domain may download HTML instead of displaying H5. Artifact upload is allowed; this is NOT a public website launch."
          fi
      - run: npm ci --no-audit --no-fund
      - name: Build immutable H5 verification package
        env:
          # Artifact lives at an immutable nested prefix, not at the host root.
          H5_OSS_ARTIFACT: '1'
          VITE_ROUTER_BASENAME: /h5/releases/${{ github.sha }}/${{ github.run_id }}.${{ github.run_attempt }}
        run: npm run build:prod
      - name: Validate production package
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const m = JSON.parse(fs.readFileSync('dist/build-meta.json', 'utf8'))
          if (m.appEnvironment !== 'prod' || m.dataMode !== 'api' || m.bridgeMode !== 'native' ||
              !m.apiBaseConfigured || !m.buddyPublicOriginConfigured ||
              m.build.sha !== process.env.GITHUB_SHA) process.exit(1)
          NODE
          test -f dist/index.html
          test ! -f dist/mockServiceWorker.js
      - name: Verify nested OSS asset paths and router basename
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const html = fs.readFileSync('dist/index.html', 'utf8')
          if (!/src="\.\/assets\//.test(html) || !/href="\.\/assets\//.test(html) ||
              /(?:src|href)="\/assets\//.test(html)) {
            throw new Error('Versioned OSS index.html must use ./assets/... for JS and CSS')
          }
          const basename = `/h5/releases/${process.env.GITHUB_SHA}/${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`
          const chunks = fs.readdirSync('dist/assets').filter(name => name.endsWith('.js'))
          if (!chunks.some(name => fs.readFileSync(`dist/assets/${name}`, 'utf8').includes(basename))) {
            throw new Error(`Built router does not contain release basename: ${basename}`)
          }
          console.log('Verified relative JS/CSS and router basename:', basename)
          NODE
      - name: Install official ossutil 2.4.0 (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-install
          sudo install -m 755 /tmp/ossutil-install/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version
      - name: Upload versioned package (non-destructive)
        shell: bash
        run: |
          set -euo pipefail
          # Every run attempt has a distinct path; retrying never overwrites prior evidence.
          target="oss://kbs-sdl/h5/releases/${GITHUB_SHA}/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}/"
          ossutil cp -r dist/ "$target"
          ossutil stat "${target}index.html"
          ossutil stat "${target}build-meta.json"
          echo "Uploaded OSS release: $target" >> "$GITHUB_STEP_SUMMARY"
          echo "This is an immutable artifact for human OSS verification, NOT a launched H5 website." >> "$GITHUB_STEP_SUMMARY"
          echo "Default-Bucket URL (may download HTML or return 403): https://kbs-sdl.oss-cn-guangzhou.aliyuncs.com/h5/releases/${GITHUB_SHA}/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}/index.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Package and verify private OSS download for human inspection
        shell: bash
        run: |
          set -euo pipefail
          target="oss://kbs-sdl/h5/releases/${GITHUB_SHA}/${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}/"
          # Upload one ZIP so a human can download all assets with one signed URL.
          (cd dist && zip -q -r "$RUNNER_TEMP/h5-release.zip" .)
          ossutil cp "$RUNNER_TEMP/h5-release.zip" "${target}h5-release.zip"
          ossutil stat "${target}h5-release.zip"

          # OSS is private; anonymous bare URLs return AccessDenied.
          # A time-limited signed GET must work without changing Bucket ACLs.
          signed_output="$(ossutil presign "${target}h5-release.zip" --expires-duration 24h)"
          signed_url="$(printf '%s\n' "$signed_output" | grep -Eo 'https://kbs-sdl[.]oss-cn-guangzhou[.]aliyuncs[.]com/[^[:space:]]+' | head -n 1)"
          test -n "$signed_url"
          curl --fail --silent --show-error --location --retry 2 "$signed_url" -o "$RUNNER_TEMP/oss-readback.zip"
          cmp "$RUNNER_TEMP/h5-release.zip" "$RUNNER_TEMP/oss-readback.zip"
          unzip -tqq "$RUNNER_TEMP/oss-readback.zip"

          mkdir -p "$RUNNER_TEMP/oss-human-verification"
          cp "$RUNNER_TEMP/oss-readback.zip" "$RUNNER_TEMP/oss-human-verification/h5-oss-verified.zip"
          printf '%s\n' "$signed_url" > "$RUNNER_TEMP/oss-human-verification/oss-signed-url.txt"
          printf 'Verified OSS path: %s\nSource SHA: %s\nRead-back SHA256: ' "$target" "$GITHUB_SHA" > "$RUNNER_TEMP/oss-human-verification/verification.txt"
          sha256sum "$RUNNER_TEMP/oss-readback.zip" >> "$RUNNER_TEMP/oss-human-verification/verification.txt"
          {
            echo "### Human verification from private OSS"
            echo "A ZIP was uploaded to OSS and downloaded back through a 24-hour signed HTTPS URL."
            echo "Full-byte comparison and ZIP integrity verification passed."
            echo ""
            echo "Download: [OSS H5 ZIP (24-hour signed link)]($signed_url)"
            echo ""
            echo "If the signed link expires, download the `oss-human-verified-*` GitHub Actions artifact below; its ZIP contains bytes **read back from OSS**."
            echo "Bucket ACL remains unchanged. This is not an activated H5 website."
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/oss-human-verification/"* "$GITHUB_WORKSPACE/" 

      - name: Attach OSS read-back proof for manual download
        uses: actions/upload-artifact@v4
        with:
          name: oss-human-verified-${{ github.sha }}
          path: |
            h5-oss-verified.zip
            oss-signed-url.txt
            verification.txt
          retention-days: 7
          if-no-files-found: error

