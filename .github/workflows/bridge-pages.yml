name: Bridge Pages CI

on:
  push:
    branches: [jsbrigge-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridge-pages
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build JSBridge debug page
        run: npm run build:dev

      - name: Publish bridge branch
        shell: bash
        run: |
          git push origin "$GITHUB_SHA:refs/heads/bridge" --force
          echo "Published $GITHUB_SHA to bridge"
          echo "Cloudflare Pages Git integration will deploy the bridge branch."
