name: OpenCode Review

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check OpenCode credentials
        id: credentials
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${OPENCODE_API_KEY}${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${OPENROUTER_API_KEY}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OpenCode review skipped: configure a supported provider secret (default: OPENCODE_API_KEY)."
          fi

      - name: Checkout repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Review pull request with DeepSeek V4.1 Flash
        id: primary-review
        if: steps.credentials.outputs.ready == 'true'
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          use_github_token: true
          model: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          prompt: |
            Review this pull request as a read-only second reviewer.

            Read and follow the repository AGENTS.md before judging the diff.
            Focus on high-confidence, actionable defects in changed code and its immediate integration surface.

            Do not modify code. Post only review findings. If there are no material findings, leave no blocking feedback.

      - name: Retry review with Union Alpha Free
        if: steps.credentials.outputs.ready == 'true' && steps.primary-review.outcome == 'failure'
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          use_github_token: true
          model: opencode-go/union-alpha-free
          prompt: |
            Retry this pull request review as a read-only second reviewer after the primary reviewer failed.

            Focus on high-confidence actionable defects only. Do not modify code.
