name: H013 MSW Bootstrap

on:
  push:
    branches: [feature/h013-msw-foundation]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate MSW dependency and worker
        run: |
          npm install --save-dev --save-exact msw@2.15.0 --no-audit --no-fund
          npx msw init public --save

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/mockServiceWorker.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: add MSW 2.15.0 worker"
          git push
