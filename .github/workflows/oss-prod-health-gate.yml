name: OSS Production Health Gate

on:
  pull_request:
    branches: [dev, test, prod]
  push:
    branches: [dev, test, prod]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Publish selected branch or restore historical release
        options: [publish, rollback]
        required: true
      release_id:
        description: Exact production history release ID to restore
        required: false
      confirm_release_id:
        description: Repeat the identical release ID to confirm manual rollback
        required: false

permissions:
  contents: read

jobs:
  contract-tests:
    name: Offline production Healthcheck and fail-closed contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run existing OSS history and new public static checks
        run: |
          set -euo pipefail
          node --check scripts/oss-prod-activate.mjs
          node --test scripts/oss-prod-release.test.mjs scripts/oss-prod-healthcheck.test.mjs
          if node scripts/oss-prod-activate.mjs publish; then
            echo "::error::OSS upload unexpectedly succeeded without a valid GitHub branch and credentials."
            exit 1
          fi
          if node scripts/oss-prod-activate.mjs rollback; then
            echo "::error::Rollback unexpectedly succeeded without an explicit historic release ID."
            exit 1
          fi
      - name: Keep legacy connectivity smoke unchanged
        run: |
          set -euo pipefail
          grep -F 'Verify company OSS write/read without publishing H5' .github/workflows/oss-connection-smoke.yml
          grep -F 'h5/releases/' .github/workflows/oss-production.yml
          echo 'Offline checks do not access OSS or activate production.'

  publish:
    name: Publish guarded fixed prod H5 and verify live company website
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/prod') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.operation == 'publish' || inputs.operation == 'rollback'))
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: oss-production
    concurrency:
      group: oss-prod-last-and-history
      cancel-in-progress: false
    env:
      OSS_REGION: cn-guangzhou
      OSS_ENDPOINT: https://oss-cn-guangzhou.aliyuncs.com
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_PROD_WEB_BASE_URL: ${{ vars.OSS_PROD_WEB_BASE_URL || 'http://kbs.3cgroup.cn/kbs-web/prod/last/' }}
      OSS_PROD_ROLLBACK_ID: ${{ inputs.release_id }}
      OSS_PROD_ROLLBACK_CONFIRM_ID: ${{ inputs.confirm_release_id }}
      VITE_API_BASE_URL: ${{ vars.OSS_PROD_API_BASE_URL }}
      VITE_BUDDY_PUBLIC_ORIGIN: ${{ vars.OSS_PROD_PUBLIC_ORIGIN }}
      H5_OSS_ARTIFACT: '1'
      OSS_WEB_TARGET: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check OSS credentials and target path (no HTTPS/API prerequisite)
        run: |
          set -euo pipefail
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          node -e "import('./scripts/oss-prod-healthcheck.mjs').then(({productionBase}) => productionBase(process.env.OSS_PROD_WEB_BASE_URL))"
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Use a Git branch"; exit 1; }
          if [[ "${{ inputs.operation }}" == "rollback" ]]; then
            test -n "$OSS_PROD_ROLLBACK_ID"
            test "$OSS_PROD_ROLLBACK_ID" = "$OSS_PROD_ROLLBACK_CONFIRM_ID"
          fi
      - name: Install build dependencies
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish')
        run: npm ci --no-audit --no-fund
      - name: Build fixed prod package and verify runtime contract
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish')
        run: |
          set -euo pipefail
          node scripts/build-h5.mjs prod
          node scripts/verify-oss-web-package.mjs prod
      - name: Install verified OSS connectivity tool (same version as existing smoke)
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  /tmp/ossutil.zip" | sha256sum -c -
          unzip -q /tmp/ossutil.zip -d /tmp/ossutil-install
          sudo install -m 755 /tmp/ossutil-install/ossutil-2.4.0-linux-amd64/ossutil /usr/local/bin/ossutil
          ossutil version
      - name: Promote and verify live H5 or explicitly rollback
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "${{ inputs.operation }}" == 'rollback' ]]; then
            node scripts/oss-prod-activate.mjs rollback
          else
            node scripts/oss-prod-activate.mjs publish
          fi
      - name: Record bounded production evidence
        if: always()
        run: |
          {
            echo '### Production Health Gate'
            echo "Source branch: ${GITHUB_REF_NAME}"
            echo "Run: ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "SHA: ${GITHUB_SHA}"
            echo "Production fixed entry: ${OSS_PROD_WEB_BASE_URL}"
            echo 'OSS byte-readback is mandatory. Public URL verification may remain pending for human acceptance; no history prune unless the public URL check passes.'
            echo 'Existing Healthcheck/OSS smoke unchanged; App WebView and API business acceptance are separate.'
          } >> "$GITHUB_STEP_SUMMARY"
