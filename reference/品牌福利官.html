<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品牌福利官 · 卡博士诗得丽</title>

  <style>
    /* ════════════════════════════════════════════════════════════
       T08 · 品牌福利官 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:Mockplus 原型(白底 + 暖金) + 画布(圆角 8/12/16/20)
       ════════════════════════════════════════════════════════════ */

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: auto;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 外层灰底预览(供桌面查看) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: auto;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题 + 右上无) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 44px;
      box-sizing: border-box;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: 600 18px/24px var(--font-family-base);
      color: var(--color-text-primary);
      text-align: center;
    }
    .ps-topbar .spacer { width: 24px; height: 24px; }

    /* ════════════════════════════════════════════════════════════
       Ambient 光斑(暖金,绝对定位铺在最底层)
       ════════════════════════════════════════════════════════════ */
    .bw-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bw-ambient > span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(28px);
    }
    .bw-amb-warm {
      width: 240px; height: 240px;
      right: -60px; top: 60px;
      background: var(--com-premium-200);
      opacity: 0.55;
    }
    .bw-amb-gold {
      width: 220px; height: 220px;
      left: -60px; top: 220px;
      background: var(--com-premium-300);
      opacity: 0.40;
    }
    .bw-amb-soft {
      width: 200px; height: 200px;
      right: -50px; top: 420px;
      background: var(--com-brand-100);
      opacity: 0.32;
    }

    .ps-topbar,
    .bw-header,
    .bw-person,
    .bw-services { position: relative; z-index: 1; }

    /* ════════════════════════════════════════════════════════════
       头部 · 话术 + 企微二维码(200×200 居中)
       ════════════════════════════════════════════════════════════ */
    .bw-header {
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .bw-head-text {
      font: var(--type-body);
      color: var(--color-text-primary);
      text-align: center;
      line-height: var(--line-height-body);
      max-width: 280px;
    }

    .bw-qr {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-lg);
      background: var(--com-neutral-100);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px -6px rgba(89, 55, 15, 0.14);
      border: 1px solid var(--color-border-subtle);
      box-sizing: border-box;
      flex-direction: column;
      gap: 6px;
      color: var(--color-text-tertiary);
    }
    .bw-qr .qr-grid {
      width: 120px;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px;
    }
    .bw-qr .qr-grid i {
      background: var(--com-neutral-500);
      display: block;
      border-radius: 1px;
      opacity: 0.55;
    }
    .bw-qr .qr-grid i.on { opacity: 0.85; }
    .bw-qr .qr-label {
      font: var(--type-label);
      color: var(--color-text-tertiary);
      letter-spacing: 0.04em;
    }
    .bw-qr-tip {
      font: var(--type-caption);
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .bw-qr-caption {
      font: 500 12px/18px var(--font-family-base);
      color: var(--color-text-secondary);
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* ════════════════════════════════════════════════════════════
       人员信息卡片(头像 48 + 姓名 16 + 简介 14,居中)
       ════════════════════════════════════════════════════════════ */
    .bw-person {
      margin: 4px 16px 0;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 16px 16px;
      box-shadow: 0 4px 16px -8px rgba(89, 55, 15, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bw-person .avatar {
      width: var(--com-size-48);
      height: var(--com-size-48);
      background: var(--com-warm-100);
      color: var(--com-premium-600);
      font: 600 18px/24px var(--font-family-base);
    }
    .bw-person .name {
      font: 600 16px/22px var(--font-family-base);
      color: var(--color-text-primary);
    }
    .bw-person .bio {
      font: 400 14px/20px var(--font-family-base);
      color: var(--color-text-secondary);
      text-align: center;
      max-width: 260px;
    }

    /* ════════════════════════════════════════════════════════════
       服务列表(3-4 条卡片 · 圆角 12 · icon + 标题 + 副文案)
       ════════════════════════════════════════════════════════════ */
    .bw-services {
      margin: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bw-services-title {
      font: 500 13px/18px var(--font-family-base);
      color: var(--color-text-tertiary);
      padding-left: 4px;
      letter-spacing: 0.04em;
    }
    .bw-service {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: 0 2px 8px -6px rgba(89, 55, 15, 0.08);
      border: 1px solid transparent;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      cursor: pointer;
    }
    .bw-service:hover,
    .bw-service:active {
      background: var(--com-brand-50);
      border-color: var(--com-brand-100);
    }
    .bw-service .icon-bubble {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: var(--com-warm-100);
      color: var(--com-premium-600);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font: 600 14px/20px var(--font-family-base);
    }
    .bw-service .text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bw-service .title {
      font: 600 16px/22px var(--font-family-base);
      color: var(--color-text-primary);
    }
    .bw-service .sub {
      font: 400 14px/20px var(--font-family-base);
      color: var(--color-text-secondary);
    }
    .bw-service .chev {
      width: var(--com-icon-size-md);
      height: var(--com-icon-size-md);
      color: var(--color-text-tertiary);
      flex: 0 0 auto;
    }

    /* 底部安全区 */
    .bw-safe-bottom { height: 24px; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style id="theme-vars">

/* @group-priority: brand, accent, success, warning, danger */

:root {
  /* neutral */

  --com-neutral-50: #F7F8FC;

  /* ink / member */

  /* premium semantic */
  --com-reward-default: var(--com-premium-300);

  --com-text-placeholder: var(--com-neutral-600);
  --com-text-disabled: var(--com-neutral-500);
  --com-text-inverse: var(--com-neutral-0);
  --com-text-brand: var(--com-brand-600);

  /* text-consumer */

  /* border */

  --font-size-title: var(--com-font-size-24);

  --font-weight-medium: var(--com-font-weight-medium);
  --font-weight-semibold: var(--com-font-weight-semibold);
  --font-weight-bold: var(--com-font-weight-bold);
