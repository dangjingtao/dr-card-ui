<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>05-分享成功</title>
  <style>
      body { margin: 0; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-family-base); -webkit-font-smoothing: antialiased; }

      /* Page shell */
      .shell { max-width: 448px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; background: var(--color-surface-page); }

      /* iOS status bar */
      .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: var(--color-text-primary); font: 600 14px/20px var(--font-family-base); }
      .status-bar .right { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; opacity: 0.7; }
      .status-bar svg { width: 14px; height: 14px; }

      /* Top app bar (per top-app-bar spec) */
      .app-bar { display: flex; align-items: center; gap: var(--space-12); min-height: var(--size-control-height-lg); padding: 0 var(--space-16); background: var(--color-surface-page); }
      .app-bar-back { width: var(--size-control-height-lg); height: var(--size-control-height-lg); border: 0; background: transparent; color: var(--color-text-primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: var(--radius-control); margin-left: -8px; }
      .app-bar-back svg { width: var(--size-icon-lg); height: var(--size-icon-lg); }
      .app-bar-title { flex: 1 1 auto; min-width: 0; font: 600 18px/24px var(--font-family-base); color: var(--color-text-primary); text-align: center; padding-right: 40px; }

      /* Section (per section spec) */
      .section { padding: 0 var(--space-16); margin-top: var(--space-20); }
      .section-header { padding: 0 var(--space-12); margin-bottom: var(--space-8); font: 600 16px/22px var(--font-family-base); color: var(--color-text-primary); }

      /* Hero success (aligned with empty-state spec) */
      .hero { display: flex; flex-direction: column; align-items: center; gap: var(--space-12); padding: 56px var(--space-20) var(--space-16); text-align: center; }
      .check-ring { width: 64px; height: 64px; border-radius: var(--radius-pill); background: var(--color-success-bg); display: inline-flex; align-items: center; justify-content: center; position: relative; }
      .check-ring::after { content: ''; position: absolute; inset: -6px; border-radius: var(--radius-pill); border: 1px dashed var(--color-success); opacity: 0.25; }
      .check-ring svg { width: 32px; height: 32px; color: var(--color-success); }
      .hero-title { font: var(--type-heading-lg); color: var(--color-text-primary); margin-top: var(--space-8); }
      .hero-sub { font: var(--type-label); color: var(--color-text-secondary); }

      /* Product preview card (per card default spec) */
      .product-card { background: var(--color-surface); border-radius: var(--radius-container); padding: var(--space-12); margin: var(--space-20) var(--space-16) 0; display: flex; gap: var(--space-12); align-items: center; }
      .product-thumb { width: 56px; height: 56px; border-radius: var(--radius-md); background: var(--color-surface-selected); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--color-text-brand); }
      .product-thumb svg { width: 28px; height: 28px; }
      .product-body { flex: 1 1 auto; min-width: 0; }
      .product-name { font: var(--type-label); color: var(--color-text-primary); }
      .product-meta { font: var(--type-caption); color: var(--color-text-tertiary); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
      .product-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--color-text-tertiary); opacity: 0.6; }
      .product-tag-wrap { margin-top: 6px; }

      /* Tag (per tag brand tone) */
      .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-pill); font: var(--type-label-small); background: var(--color-surface-selected); color: var(--color-text-brand); }

      /* Bottom action */
      .bottom-action { margin-top: auto; padding: var(--space-20) var(--space-16) calc(var(--space-16) + env(safe-area-inset-bottom)); background: var(--color-surface-page); }
      .bottom-stack { display: flex; flex-direction: column; gap: var(--space-8); align-items: center; }

      /* Button (per button spec) */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        height: var(--size-control-height-lg);
        padding: 0 24px;
        border: 0; border-radius: var(--radius-control);
        font: 500 16px/24px var(--font-family-base);
        cursor: pointer; white-space: nowrap;
        transition: background-color var(--motion-duration-fast) var(--motion-easing-standard), color var(--motion-duration-fast) var(--motion-easing-standard);
      }
      .btn-block { width: 100%; }
      .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
      .btn-primary:active { background: var(--color-primary-hover); }
      .btn-tertiary { background: transparent; color: var(--color-text-brand); height: 36px; font: 500 14px/20px var(--font-family-base); }
      .btn-tertiary:active { color: var(--color-primary-hover); background: var(--color-surface-pressed); }
    </style>
