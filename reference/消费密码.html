<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完善信息 · 卡博士诗得丽</title>
    <style id="theme-vars">
/* 积分首页等 7 个设计 - 共享设计令牌
 * 来源: com-design Mobile Design System (structured-spec)
 * 品牌前缀: cards (cardUI/积分会员设计语言)
 * 6 页面共享(每日签到领福利使用局部 warm-cream 变体,见该页自身 tokens)
 */

:root {
  /* neutral */
  --cards-neutral-0: #FFFFFF;
  --cards-neutral-50: #F7F8FC;
  --cards-neutral-100: #F0F2F8;
  --cards-neutral-200: #E2E6F0;
  --cards-neutral-300: #CDD3E1;
  --cards-neutral-400: #8590A3;
  --cards-neutral-500: #687288;
  --cards-neutral-600: #535D72;
  --cards-neutral-700: #394156;
  --cards-neutral-800: #252B3D;
  --cards-neutral-900: #171B2A;

  /* warm surface — 页面底色 */
  --cards-warm-50: #FCF8F1;
  --cards-warm-100: #F8F0E5;

  /* brand — 橘色主品牌,行动色 */
  --cards-brand-50: #FFF3EC;
  --cards-brand-100: #FFE3D5;
  --cards-brand-200: #FFC4AA;
  --cards-brand-400: #FF7540;
  --cards-brand-500: #ED4D1B; /* @primary */
  --cards-brand-600: #D63D10;
  --cards-brand-700: #AD2E0A;

  /* accent — 青蓝强调 */
  --cards-accent-50: #E9FCFF;
  --cards-accent-100: #CAF7FB;
  --cards-accent-500: #16BFD3;
  --cards-accent-600: #0E9FB3;

  /* premium / reward — 金色奖励 */
  --cards-premium-50: #FFFBEB;
  --cards-premium-100: #FEF3C7;
  --cards-premium-300: #FCD34D;
  --cards-premium-500: #F59E0B;
  --cards-premium-700: #B45309;

  /* status */
  --cards-success-500: #21B66F;
  --cards-warning-500: #F3A21B;
  --cards-danger-500: #D63E50;

  /* semantic aliases (apply-html-head-contract 必需) */
  --cards-background: var(--cards-warm-50);
  --cards-foreground: var(--cards-neutral-800);
  --cards-card: var(--cards-neutral-0);
  --cards-primary: var(--cards-brand-500);
  --cards-border: var(--cards-neutral-200);
  --cards-muted: var(--cards-neutral-400);
  --cards-radius-sm: 8px;
  --cards-radius-md: 12px;
  --cards-radius-lg: 20px;
}

/* 每日签到领福利 局部 warm-cream 变体(覆盖在 :root 之上) */
.page-checkin {
  --ck-background: #FFF8F3;
  --ck-foreground: #1F2937;
  --ck-card: #FFFFFF;
  --ck-primary: #FF7A33;
  --ck-border: #F0E6DC;
  --ck-muted: #8590A3;
}

    </style>

   <span class="avatar avatar-sm">用户头像缩略图(内联 SVG)</span>
   <span class="avatar avatar-md">用户头像(内联 SVG)</span>
*/
/* Component definitions — extracted to components.css by deterministic script */
  .avatar { box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; background: var(--color-surface-subtle); color: var(--color-text-primary); border-radius: var(--radius-full); font-weight: var(--font-weight-medium); }

/* ── Badge ─────────────────────────────────────────────────── */

   <span class="label">色调</span> <span class="badge default">默认</span> <span class="badge brand">品牌</span> <span class="badge success">成功</span> <span class="badge warning">警告</span> <span class="badge danger">错误</span> <span class="badge reward">会员</span>
*/
.badge { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-4); height: 20px; min-width: 20px; padding: 0 var(--space-8); border-radius: var(--radius-xs); font: var(--type-label-small); white-space: nowrap; flex-shrink: 0; }
  .badge .dot { width: 6px; height: 6px; border-radius: var(--radius-full); flex-shrink: 0; }
  .badge.default { background: var(--color-surface-subtle); color: var(--color-text-primary); }
  .badge.brand { background: var(--color-primary-container); color: var(--color-on-primary-container); }
  .badge.success { background: var(--color-success-bg); color: var(--color-success-text); }
  .badge.warning { background: var(--color-warning-bg); color: var(--color-warning-text); }

  .badge.brand .dot { background: var(--color-on-primary-container); }
  .badge.success .dot { background: var(--color-success); }
  .badge.warning .dot { background: var(--color-warning); }
  .badge.danger .dot { background: var(--color-danger); }
  .badge.reward .dot { background: var(--color-reward-text); }

/* ── Button ────────────────────────────────────────────────── */
/* @anatomy
   <span class="label">主要操作</span><button class="btn btn-primary" data-evidence-sample="primary-md-default">立即开通</button><button class="btn btn-primary btn-lg" data-evidence-sample="primary-lg-default">立即开通</button>
*/
/* Component definitions — extracted to components.css by deterministic script */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-4); border: none; cursor: pointer; font: var(--type-label); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; transition: background .15s, border-color .15s; flex-shrink: 0; min-width: var(--size-control-height); height: var(--size-control-height); padding: var(--density-padding-v) var(--density-padding-h); border-radius: var(--radius-control); color: var(--color-text-inverse); }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover, .btn-primary:active { background: var(--color-primary-hover); }
.btn-secondary { background: var(--color-secondary); color: var(--color-text-brand); }
.btn-secondary:hover, .btn-secondary:active { background: var(--color-secondary-hover); }
.btn-destructive { background: var(--color-destructive); color: var(--color-text-inverse); }

.btn-lg { height: var(--size-control-height-lg); min-width: var(--size-control-height-lg); padding: var(--space-12) var(--space-20); font: var(--type-heading-small); }
.btn[disabled] { background: var(--color-disabled); color: var(--color-text-disabled); cursor: not-allowed; pointer-events: none; }

/* ── Card ──────────────────────────────────────────────────── */
/* @anatomy
   <div class="card padding-md"><div class="card-header"><h3 class="card-title">尊享礼遇</h3><button class="card-action">查看</button>
*/
.card { width: 100%; box-sizing: border-box; background: var(--color-surface); border-radius: var(--radius-container); overflow: hidden; }
  .card.padding-md { padding: var(--space-16); }
  .card.padding-lg { padding: var(--space-20); }
  .card.elevated { box-shadow: var(--shadow-1); }
  .card.member { background: var(--color-member-surface); color: var(--color-member-text); }
  .card:hover { filter: brightness(0.97); transition: filter var(--motion-duration-fast); }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-8); margin-bottom: var(--space-12); }
  .card-title { font: var(--type-heading-small); color: inherit; margin: 0; }
  .card-action { font: var(--type-label-small); color: var(--color-text-brand); background: none; border: none; padding: 0; cursor: pointer; white-space: nowrap; transition: color var(--motion-duration-fast); }
  .card-action:hover { color: var(--color-text-brand); }
  .member .card-action { color: var(--color-member-accent); }
  .card-body { font: var(--type-body-small); color: var(--color-text-secondary); line-height: var(--line-height-body-small); }
  .member .card-body { color: var(--color-member-text); }
  .card-footer { display: flex; gap: var(--space-8); margin-top: var(--space-16); }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-control-height); min-width: var(--size-control-height); padding: 0 var(--space-16); border: none; border-radius: var(--radius-control); font: var(--type-label); color: var(--color-on-primary); background: var(--color-primary); cursor: pointer; white-space: nowrap; transition: background var(--motion-duration-fast); }
  .btn:hover { background: var(--color-primary-hover); }

/* ── Input ─────────────────────────────────────────────────── */

   <div class="field-group"> <label class="field-label">手机号</label> <input class="com-input" type="text" placeholder="请输入手机号">

<body>
    <main class="app-container" data-page-id="page-完善信息">
        <!-- Status bar -->
        <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <span class="right">
                <i data-lucide="signal" class="icon"></i>
                <i data-lucide="wifi" class="icon"></i>
                <i data-lucide="battery-full" class="icon"></i>
            </span>
        </div>

        <!-- Top bar(左返回 / 中「完善信息」/ 右上无) -->
        <header class="ps-topbar">
            <button type="button" class="icon-btn" aria-label="返回上级页面" data-dom-id="t01-back">
                <i data-lucide="chevron-left" class="icon"></i>
            </button>
            <h1>完善信息</h1>
            <span class="spacer" aria-hidden="true"></span>
        </header>

        <!-- Ambient 光斑 -->
        <div class="me-ambient" aria-hidden="true">
            <span class="me-amb-warm"></span>
            <span class="me-amb-brand-1"></span>
            <span class="me-amb-brand-2"></span>
        </div>

        <!-- ══════════ 主体卡片(头像 + 5 个字段) ══════════ -->
        <section class="pf-card" aria-label="完善个人信息表单">

            <!-- 头像上传 -->
            <div class="pf-head">
                <button type="button" class="pf-avatar" aria-label="上传头像" data-dom-id="t01-avatar">
                    <span class="plus" aria-hidden="true">+</span>
                </button>
                <span class="pf-avatar-hint">点击上传头像</span>
            </div>

            <!-- 字段组 -->
            <div class="pf-fields">

                <!-- 昵称 -->
                <div class="pf-field">
                    <label class="pf-label" for="pf-nick">昵称<span class="req" aria-hidden="true">*</span></label>
                    <div class="pf-input">
                        <input id="pf-nick" type="text" placeholder="请输入昵称" maxlength="20" autocomplete="nickname" aria-required="true">
                    </div>
                </div>

                <!-- 生日 -->
                <div class="pf-field">
                    <label class="pf-label" for="pf-birth">生日</label>
                    <div class="pf-input">
                        <input id="pf-birth" type="text" placeholder="请选择生日" readonly aria-haspopup="dialog">
                        <i data-lucide="calendar" class="pf-icon" aria-hidden="true"></i>
                    </div>
                </div>

                <!-- 身份(单选) -->
                <div class="pf-field">
                    <span class="pf-label" id="pf-role-label">身份</span>
                    <div class="pf-radios" role="radiogroup" aria-labelledby="pf-role-label" data-name="role">
                        <button type="button" class="pf-radio is-checked" role="radio" aria-checked="true" data-value="学生" data-dom-id="t01-role-student">
                            <span class="dot" aria-hidden="true"></span>
                            <span>学生</span>
                        </button>
                        <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="职场" data-dom-id="t01-role-worker">
                            <span class="dot" aria-hidden="true"></span>
                            <span>职场</span>
                        </button>
                    </div>
                </div>

                <!-- 性别(单选) -->
                <div class="pf-field">
                    <span class="pf-label" id="pf-gender-label">性别</span>
                    <div class="pf-radios" role="radiogroup" aria-labelledby="pf-gender-label" data-name="gender">
                        <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="男" data-dom-id="t01-gender-male">
                            <span class="dot" aria-hidden="true"></span>
                            <span>男</span>
                        </button>
                        <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="女" data-dom-id="t01-gender-female">
                            <span class="dot" aria-hidden="true"></span>
                            <span>女</span>
                        </button>
                    </div>
                </div>

                <!-- 消费密码(6 位) -->
                <div class="pf-field">
                    <label class="pf-label" for="pf-pin">消费密码<span class="req" aria-hidden="true">*</span></label>
                    <div class="pf-pin" id="pf-pin" role="group" aria-label="6 位消费密码" tabindex="0" inputmode="numeric" data-dom-id="t01-pin">
                        <span class="pf-pin-cell is-focus" data-index="0"><span class="caret" aria-hidden="true"></span></span>
                        <span class="pf-pin-cell" data-index="1"></span>
                        <span class="pf-pin-cell" data-index="2"></span>
                        <span class="pf-pin-cell" data-index="3"></span>
                        <span class="pf-pin-cell" data-index="4"></span>
                        <span class="pf-pin-cell" data-index="5"></span>
                    </div>
                    <span class="pf-helper" id="pf-pin-helper" aria-live="polite">6 位数字 · 用于门店消费核验</span>
                </div>

            </div>
        </section>

        <!-- 底部主按钮(高 48 圆角 24 brand-500 白字 · 宽 100% max 343) -->
        <div class="pf-submit-wrap">
            <button type="button" class="pf-submit" id="pf-submit" data-dom-id="t01-submit" disabled aria-label="确认信息">
                <span>确认信息</span>
                <i data-lucide="chevron-right" class="icon" aria-hidden="true"></i>
            </button>
        </div>

        <div class="pf-safe-bottom" aria-hidden="true"></div>
    </main>

    <div class="app-tabbar-spacer" aria-hidden="true"></div>

    <!-- 底部 TabBar · 5 项,中间扫码 FAB 凸起(沿用画布范式) -->
    <nav class="app-tabbar" aria-label="底部导航">
        <button type="button" class="app-tabbar-item" aria-label="首页" data-dom-id="t01-tab-home">
            <i data-lucide="home" class="icon"></i>
            <span class="app-tabbar-label">首页</span>
        </button>
        <button type="button" class="app-tabbar-item" aria-label="积分" data-dom-id="t01-tab-points">
            <i data-lucide="coins" class="icon"></i>
            <span class="app-tabbar-label">积分</span>
        </button>
        <button type="button" class="app-tabbar-item is-fab" aria-label="扫码" data-dom-id="t01-tab-scan">
            <span class="fab-bubble"><i data-lucide="qr-code" class="icon"></i></span>
            <span class="app-tabbar-label">扫码</span>
        </button>
        <button type="button" class="app-tabbar-item" aria-label="消息" data-dom-id="t01-tab-msg">
            <i data-lucide="message-circle" class="icon"></i>
            <span class="app-tabbar-label">消息</span>
        </button>
        <button type="button" class="app-tabbar-item is-active" aria-label="我的" aria-current="page" data-dom-id="t01-tab-me">
            <i data-lucide="user" class="icon"></i>
            <span class="app-tabbar-label">我的</span>
        </button>
    </nav>

    <script>
    (function () {
        'use strict';

        // Lucide 图标初始化
        function bootLucide() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootLucide);
        } else {
            bootLucide();
        }
        setTimeout(bootLucide, 50);

        // ── Radio 切换(身份 / 性别) ──
        document.querySelectorAll('.pf-radios').forEach(function (group) {
            group.addEventListener('click', function (e) {
                var btn = e.target.closest('.pf-radio');
                if (!btn) return;
                group.querySelectorAll('.pf-radio').forEach(function (b) {
                    b.classList.remove('is-checked');
                    b.setAttribute('aria-checked', 'false');
                });
                btn.classList.add('is-checked');
                btn.setAttribute('aria-checked', 'true');
                refreshSubmit();
            });
        });

        // ── 头像上传占位 ──
        document.getElementById('t01-avatar').addEventListener('click', function () {
            // 占位:真实项目会唤起相册/拍照,此处仅给视觉反馈
            var btn = this;
            btn.style.background = 'var(--cards-brand-50)';
            setTimeout(function () { btn.style.background = ''; }, 220);
        });

        // ── 6 位消费密码:容器 focus → 监听 keydown ──
        var pin = document.getElementById('pf-pin');
        var cells = pin.querySelectorAll('.pf-pin-cell');
        var pinValue = '';
        var pinLocked = false;
        var pinHelper = document.getElementById('pf-pin-helper');

        function renderPin() {
            var len = pinValue.length;
            cells.forEach(function (cell, i) {
                cell.classList.remove('is-filled', 'is-focus');
                cell.innerHTML = '';
                if (i < len) {
                    cell.classList.add('is-filled');
                    cell.textContent = '•';
                }
            });
            if (len < 6) {
                cells[len].classList.add('is-focus');
                cells[len].innerHTML = '<span class="caret" aria-hidden="true"></span>';
            }
        }

        function pinHandleKey(e) {
            if (pinLocked) return;
            if (/^[0-9]$/.test(e.key)) {
                if (pinValue.length < 6) {
                    pinValue += e.key;
                    renderPin();
                    e.preventDefault();
                }
            } else if (e.key === 'Backspace') {
                if (pinValue.length > 0) {
                    pinValue = pinValue.slice(0, -1);
                    renderPin();
                    e.preventDefault();
                }
            }
            refreshSubmit();
        }

        pin.addEventListener('click', function () { pin.focus(); });
        pin.addEventListener('keydown', pinHandleKey);
        document.addEventListener('keydown', function (e) {
            if (document.activeElement === pin) pinHandleKey(e);
        });

        // ── 昵称:input 事件 → refresh submit 可用性 ──
        document.getElementById('pf-nick').addEventListener('input', refreshSubmit);

        // ── 生日:点击唤起 date picker 占位 ──
        document.getElementById('pf-birth').addEventListener('click', function () {
            // 占位:真实项目会唤起底部 sheet
            if (this.value) return;
            // 用 iOS 风格的 native date picker
            try {
                var tmp = document.createElement('input');
                tmp.type = 'date';
                tmp.style.position = 'absolute';
                tmp.style.left = '-9999px';
                document.body.appendChild(tmp);
                tmp.addEventListener('change', function () {
                    if (tmp.value) document.getElementById('pf-birth').value = tmp.value;
                    tmp.remove();
                });
                tmp.showPicker ? tmp.showPicker() : tmp.click();
            } catch (err) {
                // 兜底:不做操作
            }
        });

        // ── 提交按钮可用性:昵称非空 + 密码 6 位才允许点击 ──
        var submitBtn = document.getElementById('pf-submit');
        function refreshSubmit() {
            var nick = document.getElementById('pf-nick').value.trim();
            var ok = nick.length > 0 && pinValue.length === 6;
            submitBtn.disabled = !ok;
        }

        // ── 提交:保存成功占位反馈(画布不跳页) ──
        submitBtn.addEventListener('click', function () {
            if (submitBtn.disabled) return;
            pinLocked = true;
            submitBtn.disabled = true;
            submitBtn.querySelector('span').textContent = '已确认';
            submitBtn.style.background = 'var(--cards-success-500, #21B66F)';
            pinHelper.textContent = '已保存';
            setTimeout(function () {
                submitBtn.querySelector('span').textContent = '确认信息';
                submitBtn.style.background = '';
                pinHelper.textContent = '6 位数字 · 用于门店消费核验';
                pinLocked = false;
                refreshSubmit();
            }, 1500);
        });

        // ── 初始化 ──
        renderPin();
        refreshSubmit();
    })();
    </script>
