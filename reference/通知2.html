<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通知 · 卡博士诗得丽</title>

  <style>
    /* ════════════════════════════════════════════════════════════
       T04 · 通知列表 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:画布已审定 7 页 TopBar / Tab / 卡片范式
       ════════════════════════════════════════════════════════════ */

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: auto;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 外层灰底预览(供桌面查看) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: auto;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题 + 一键已读 文字按钮) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 44px;
      box-sizing: border-box;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
      flex: 0 0 24px;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: 600 18px/24px var(--font-family-base);
      color: var(--color-text-primary);
      text-align: center;
    }
    /* 文字按钮:14pt 暖金,无背景 */
    .ps-topbar .text-btn {
      flex: 0 0 auto;
      background: transparent;
      border: 0;
      padding: 4px 2px;
      cursor: pointer;
      font: 500 14px/20px var(--font-family-base);
      color: var(--com-premium-500);
      transition: opacity var(--motion-duration-fast);
      white-space: nowrap;
    }
    .ps-topbar .text-btn:hover { opacity: 0.78; }
    .ps-topbar .text-btn:active { opacity: 0.6; }
    .ps-topbar .text-btn:disabled,
    .ps-topbar .text-btn[aria-disabled="true"] {
      color: var(--color-text-disabled);
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ════════════════════════════════════════════════════════════
       Tab · 4 段(全部 / 未读 / 系统 / 活动)
       顶部 4 段 Tab,圆角 12 背景 --com-neutral-100,激活态 brand-500 白字
       ════════════════════════════════════════════════════════════ */
    .nt-tab-wrap {
      margin: 4px 16px 12px;
      padding: 4px;
      background: var(--com-neutral-100);
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .nt-tab {
      height: 32px;
      border: 0;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      font: 500 13px/20px var(--font-family-base);
      color: var(--com-neutral-800);
      transition: background var(--motion-duration-fast),
                  color var(--motion-duration-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 4px;
      box-sizing: border-box;
    }
    .nt-tab:hover { background: rgba(255, 255, 255, 0.5); }
    .nt-tab.is-active {
      background: var(--com-brand-500);
      color: var(--com-neutral-0);
      box-shadow: 0 2px 6px -2px rgba(214, 61, 16, 0.30);
    }
    .nt-tab .nt-count {
      font: 600 11px/14px var(--font-family-base);
      padding: 0 5px;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      background: var(--com-danger-500);
      color: var(--com-neutral-0);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .nt-tab:not(.is-active) .nt-count {
      background: var(--com-danger-500);
      color: var(--com-neutral-0);
    }
    .nt-tab.is-active .nt-count {
      background: rgba(255, 255, 255, 0.28);
      color: var(--com-neutral-0);
    }

    /* ════════════════════════════════════════════════════════════
       列表卡片(12 圆角 白底)+ 列表分组
       ════════════════════════════════════════════════════════════ */
    .nt-list {
      margin: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nt-section-label {
      font: 500 12px/16px var(--font-family-base);
      color: var(--color-text-tertiary);
      padding: 4px 4px 2px;
      letter-spacing: 0.04em;
    }

    .nt-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--color-surface);
      border-radius: 12px;
      padding: 14px 14px 12px;
      box-shadow: 0 2px 8px -4px rgba(89, 55, 15, 0.06);
      cursor: pointer;
      transition: background var(--motion-duration-fast),
                  transform var(--motion-duration-fast);
      position: relative;
    }
    .nt-card:hover { background: var(--com-warm-50); }
    .nt-card:active { transform: scale(0.995); }

    /* 左侧分类小圆点(8×8 品牌色,根据 cat 切换) */
    .nt-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--com-brand-500);
      flex: 0 0 8px;
      margin-top: 6px;
      box-sizing: border-box;
    }
    .nt-dot[data-cat="system"] { background: var(--com-premium-500); }
    .nt-dot[data-cat="activity"] { background: var(--com-accent-semantic-default); }

    .nt-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nt-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .nt-title {
      font: 600 16px/22px var(--font-family-base);
      color: var(--color-text-primary);
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nt-time {
      font: 400 12px/16px var(--font-family-base);
      color: var(--color-text-tertiary);
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .nt-summary {
      font: 400 14px/20px var(--font-family-base);
      color: var(--color-text-secondary);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 未读态:右侧 8px 红点 */
    .nt-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--com-danger-500);
      flex: 0 0 8px;
      margin-top: 7px;
      align-self: flex-start;
      box-sizing: border-box;
    }
    .nt-card.is-read .nt-unread-dot { display: none; }
    .nt-card.is-read .nt-title { font-weight: 500; }

    /* 类别徽章(可选,小标签) */
    .nt-tag {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 6px;
      border-radius: 4px;
      font: 500 10px/14px var(--font-family-base);
      letter-spacing: 0.04em;
      background: var(--com-brand-50);
      color: var(--com-brand-700);
      flex: 0 0 auto;
    }
    .nt-tag[data-cat="system"] { background: var(--com-premium-50); color: var(--com-premium-700); }
    .nt-tag[data-cat="activity"] { background: var(--com-accent-semantic-subtle); color: var(--com-accent-semantic-strong); }

    /* ════════════════════════════════════════════════════════════
       空态
       ════════════════════════════════════════════════════════════ */
    .nt-empty {
      margin: 48px 32px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--color-text-tertiary);
    }
    .nt-empty .illu {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--com-warm-50);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nt-empty .illu .icon { width: 48px; height: 48px; color: var(--com-premium-300); stroke-width: 1.6; }
    .nt-empty .title {
      font: 600 15px/22px var(--font-family-base);
      color: var(--color-text-secondary);
      margin: 0;
    }
    .nt-empty .sub {
      font: 400 12px/18px var(--font-family-base);
      color: var(--color-text-tertiary);
      margin: 0;
      text-align: center;
    }

    /* 列表隐藏工具类 */
    .nt-hidden { display: none !important; }

    /* 底部安全区 */
    .pf-safe-bottom { height: 24px; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
<style id="theme-vars">
/* Source: structured-spec */
/* com-design Mobile Design System — Source: structured-spec */
/* @group-priority: brand, accent, success, warning, danger */

:root {
  /* neutral */
  --com-neutral-0: #FFFFFF;
  --com-neutral-50: #F7F8FC;
  --com-neutral-100: #F0F2F8;
  --com-neutral-200: #E2E6F0;
  --com-neutral-300: #CDD3E1;
  --com-neutral-400: #8590A3;
  --com-neutral-500: #687288;
  --com-neutral-600: #535D72;
  --com-neutral-700: #394156;
  --com-neutral-800: #252B3D;
  --com-neutral-900: #171B2A;

  /* warm */
  --com-warm-50: #FCF8F1;
  --com-warm-100: #F8F0E5;

  /* ink / member */
  --com-ink-900: #1C1B18;
  --com-ink-800: #292722;

  --com-member-surface: var(--com-ink-900);
  --com-member-text: #FFF9EA;
  --com-member-accent: var(--com-premium-300);

  /* brand */
  --com-brand-50: #FFF3EC;
  --com-brand-100: #FFE3D5;
  --com-brand-200: #FFC4AA;
  --com-brand-400: #FF7540;
  --com-brand-500: #ED4D1B; /* @primary */
  --com-brand-600: #D63D10;
  --com-brand-700: #AD2E0A;

  /* premium / reward · v2 (2026-08-15 · 压金 -25% 饱和 · 保留金相) */
  --com-premium-50: #FFF9EA;
  --com-premium-100: #F4E7C2;
  --com-premium-200: #DDC58C;
  --com-premium-300: #D5B075;
  --com-premium-400: #C19854;
  --com-premium-500: #A07B41;
  --com-premium-600: #806030;
  --com-premium-700: #5D4120;
  --com-premium-900: #2A1E10;

  /* premium semantic */
  --com-reward-default: var(--com-premium-300);
  --com-reward-strong: var(--com-premium-500);
  --com-reward-subtle: var(--com-premium-50);
  --com-reward-text: var(--com-premium-700);

  /* accent */
  --com-accent-50: #E9FCFF;

  --com-accent-600: #0E9FB3;

  --com-accent-semantic-strong: var(--com-accent-600);
  --com-accent-semantic-subtle: var(--com-accent-50);

  /* accent-consumer */
  --color-accent: var(--com-accent-semantic-default);
  --color-accent-strong: var(--com-accent-semantic-strong);
  --color-accent-subtle: var(--com-accent-semantic-subtle);

  /* reward-consumer */
  --color-reward: var(--com-reward-default);
  --color-reward-strong: var(--com-reward-strong);
  --color-reward-subtle: var(--com-reward-subtle);
  --color-reward-text: var(--com-reward-text);

  /* member-consumer */
  --color-member-surface: var(--com-member-surface);
  --color-member-text: var(--com-member-text);
  --color-member-accent: var(--com-member-accent);

  /* success */
  --com-success-100: #DDF8EA;
  --com-success-500: #21B66F;
  --com-success-700: #147A4C;

  /* warning */
  --com-warning-100: #FFF2D6;
  --com-warning-500: #F3A21B;
  --com-warning-700: #9A6110;

  /* danger */
  --com-danger-100: #FFE4E8;
  --com-danger-500: #D63E50;
  --com-danger-700: #A92939;

  /* text */
  --com-text-primary: var(--com-neutral-800);
  --com-text-secondary: var(--com-neutral-600);
  --com-text-tertiary: var(--com-neutral-500);
  --com-text-placeholder: var(--com-neutral-600);
  --com-text-disabled: var(--com-neutral-500);
  --com-text-inverse: var(--com-neutral-0);
  --com-text-brand: var(--com-brand-600);
  --com-text-link: var(--com-brand-600);

  /* text-consumer */
  --color-text-primary: var(--com-text-primary);
  --color-text-secondary: var(--com-text-secondary);
  --color-text-tertiary: var(--com-text-tertiary);
  --color-text-placeholder: var(--com-text-placeholder);
  --color-text-disabled: var(--com-text-disabled);
  --color-text-inverse: var(--com-text-inverse);
  --color-text-brand: var(--com-text-brand);

  /* surface */
  --com-surface-page: var(--com-warm-50);
  --com-surface-default: var(--com-neutral-0);
  --com-surface-subtle: var(--com-neutral-100);
  --com-surface-selected: var(--com-brand-50);
  --com-surface-pressed: var(--com-neutral-100);
  --com-surface-inverse: var(--com-neutral-800);

  /* surface-consumer */
  --color-background: var(--com-surface-page);
  --color-foreground: var(--com-text-primary);
  --color-surface: var(--com-surface-default);
  --color-surface-subtle: var(--com-surface-subtle);
  --color-surface-selected: var(--com-surface-selected);
  --color-surface-pressed: var(--com-surface-pressed);
  --color-surface-inverse: var(--com-surface-inverse);

  /* border */
  --com-border-subtle: var(--com-neutral-200);
  --com-border-default: var(--com-neutral-400);
  --com-border-strong: var(--com-neutral-500);
  --com-border-focused: var(--com-brand-500);

  /* border-consumer */

  --color-border: var(--com-border-default);
  --color-border-strong: var(--com-border-strong);
  --color-border-focused: var(--com-border-focused);
  --color-border-error: var(--com-border-error);

  /* action — primary 走 brand-600，white 文字对比度 5.41:1 (AA)；

  --com-action-primary: var(--com-brand-600);

  --com-action-secondary: var(--com-brand-50);
  --com-action-secondary-pressed: var(--com-brand-100);
  --com-action-destructive: var(--com-danger-500);

  --com-action-disabled: var(--com-neutral-200);

  /* action-consumer */
  --color-primary: var(--com-action-primary);

  --color-on-primary: #FFFFFF;
  --color-primary-container: var(--com-brand-50);

  --color-secondary: var(--com-action-secondary);
  --color-secondary-hover: var(--com-action-secondary-pressed);
  --color-destructive: var(--com-action-destructive);
  --color-destructive-hover: var(--com-action-destructive-pressed);
  --color-disabled: var(--com-action-disabled);

  /* status */
  --com-status-success: var(--com-success-500);
  --com-status-success-bg: var(--com-success-100);
  --com-status-success-text: var(--com-success-700);
  --com-status-warning: var(--com-warning-500);
  --com-status-warning-bg: var(--com-warning-100);
  --com-status-warning-text: var(--com-warning-700);
  --com-status-danger: var(--com-danger-500);
  --com-status-danger-bg: var(--com-danger-100);
  --com-status-danger-text: var(--com-danger-700);
  --com-status-info: var(--com-brand-500);
  --com-status-info-bg: var(--com-brand-50);
  --com-status-info-text: var(--com-brand-700);

  --com-scrim: rgba(0,0,0,0.52);

  /* icon & indicator */

  --com-icon-size-md: 20px;
  --com-icon-size-lg: 24px;
  --com-indicator-size-inline: 16px;
  --com-indicator-size-regular: 24px;

  /* typography primitives */

  --com-font-size-18: 18px;

  --com-line-height-24: 24px;

  /* status-consumer */

  /* radius */

  --com-radius-4: 4px;
  --com-radius-8: 8px;

  /* portable typography */

  --type-body-small: 400 14px/20px var(--font-family-base);
  --type-label: 500 14px/20px var(--font-family-base);

      <span class="right">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/></svg>
      </span>
    </div>

    <!-- Top bar -->
    <header class="ps-topbar">
      <button type="button" class="icon-btn" aria-label="返回">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>通知</h1>
      <button type="button" class="text-btn" id="nt-mark-all" aria-label="一键已读">一键已读</button>
    </header>

    <!-- Tab 4 段 -->
    <div class="nt-tab-wrap" role="tablist" aria-label="通知分类">
      <button type="button" class="nt-tab is-active" role="tab" aria-selected="true" data-tab="all">
        <span>全部</span>
        <span class="nt-count" id="nt-count-all">4</span>
      </button>
      <button type="button" class="nt-tab" role="tab" aria-selected="false" data-tab="unread">
        <span>未读</span>
        <span class="nt-count" id="nt-count-unread">3</span>
      </button>
      <button type="button" class="nt-tab" role="tab" aria-selected="false" data-tab="system">
        <span>系统</span>
      </button>
      <button type="button" class="nt-tab" role="tab" aria-selected="false" data-tab="activity">
        <span>活动</span>
      </button>
    </div>

    <!-- 通知列表(由 JS 渲染) -->
    <div class="nt-list" id="nt-list" aria-live="polite"></div>

    <!-- 空态(由 JS 切换) -->
    <div class="nt-empty nt-hidden" id="nt-empty" aria-hidden="true">
      <div class="illu" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </div>
      <p class="title">暂无通知</p>
      <p class="sub">当前分类下还没有消息 · 下拉刷新看看</p>
    </div>

    <div class="pf-safe-bottom" aria-hidden="true"></div>
  </main>

  <script>
    /* ════════════════════════════════════════════════════════════
       Mock 数据(6 条,跨系统/活动,3 条未读)
       category: all = 通配, system = 系统, activity = 活动
       ════════════════════════════════════════════════════════════ */
    var NOTIFICATIONS = [
      {
        id: 'n1',
        cat: 'system',
        title: '订单核销成功',
        summary: '您的到店核销码 8821 已于 14:32 在「上海·徐汇店」完成核销,本次消耗 280 泡泡值。',
        time: '刚刚',
        unread: true
      },
      {
        id: 'n2',
        cat: 'activity',
        title: '双十一宠粉福利 · 限时开启',
        summary: '11.01–11.11 每日 10:00 限量抢兑「诗得丽洗护礼盒」,首单立减 ¥58,数量有限先到先得。',
        time: '10 分钟前',
        unread: true
      },
      {
        id: 'n3',
        cat: 'system',
        title: '泡泡值到账提醒',
        summary: '您昨日完成的「每日签到」已奖励 20 泡泡值,当前余额 1,260,有效期 90 天。',
        time: '今天 09:12',
        unread: true
      },
      {
        id: 'n4',
        cat: 'activity',
        title: '搭子邀请待你回应',
        summary: '「小宇宙」邀请你参加本周六的「诗得丽洗护课堂」,点击查看详情并确认。',
        time: '昨天 21:40',
        unread: false
      },
      {
        id: 'n5',
        cat: 'system',
        title: '资料完善奖励已发放',
        summary: '感谢您完善个人资料,15 泡泡值奖励已到账。',
        time: '昨天 18:05',
        unread: false
      },
      {
        id: 'n6',
        cat: 'activity',
        title: '「品牌福利官」11 月好物上新',
        summary: '本月新增 6 款专属兑换好物,含「丝享柔顺洗发水 500ml」与「暖橙随身杯」,先到先兑。',
        time: '11-13',
        unread: false
      }
    ];

    var state = { tab: 'all' };

    /* ── 工具:格式化分类名 ── */
    function catLabel(cat) {
      if (cat === 'system') return '系统';
      if (cat === 'activity') return '活动';
      return '通用';
    }

    /* ── 渲染列表 ── */
    function render() {
      var list = document.getElementById('nt-list');
      var empty = document.getElementById('nt-empty');
      var data = NOTIFICATIONS.filter(function (n) {
        if (state.tab === 'all') return true;
        if (state.tab === 'unread') return n.unread;
        return n.cat === state.tab;
      });

      // 更新 Tab 计数
      var totalUnread = NOTIFICATIONS.filter(function (n) { return n.unread; }).length;
      var totalAll = NOTIFICATIONS.length;
      document.getElementById('nt-count-all').textContent = totalUnread > 0 ? totalUnread : totalAll;
      document.getElementById('nt-count-unread').textContent = totalUnread;

      if (!data.length) {
        list.innerHTML = '';
        list.classList.add('nt-hidden');
        empty.classList.remove('nt-hidden');
        empty.setAttribute('aria-hidden', 'false');
      } else {
        empty.classList.add('nt-hidden');
        empty.setAttribute('aria-hidden', 'true');
        list.classList.remove('nt-hidden');

        // 分组:今天 / 昨天 / 更早
        var groups = { '今天': [], '昨天': [], '更早': [] };
        data.forEach(function (n) {
          if (/刚刚|分钟前|今天/.test(n.time)) groups['今天'].push(n);
          else if (/昨天/.test(n.time)) groups['昨天'].push(n);
          else groups['更早'].push(n);
        });

        var html = '';
        Object.keys(groups).forEach(function (g) {
          if (!groups[g].length) return;
          html += '<div class="nt-section-label">' + g + '</div>';
          groups[g].forEach(function (n) {
            html += renderCard(n);
          });
        });
        list.innerHTML = html;
      }

      // 一键已读按钮态
      var markBtn = document.getElementById('nt-mark-all');
      if (totalUnread === 0) {
        markBtn.setAttribute('aria-disabled', 'true');
        markBtn.textContent = '全部已读';
      } else {
        markBtn.removeAttribute('aria-disabled');
        markBtn.textContent = '一键已读';
      }
    }

    function renderCard(n) {
      var dot = '<span class="nt-dot" data-cat="' + n.cat + '" aria-hidden="true"></span>';
      var unread = n.unread
        ? '<span class="nt-unread-dot" aria-label="未读" role="img"></span>'
        : '';
      var tagHtml = '<span class="nt-tag" data-cat="' + n.cat + '">' + catLabel(n.cat) + '</span>';
      return (
        '<article class="nt-card ' + (n.unread ? 'is-unread' : 'is-read') +
        '" data-id="' + n.id + '" data-cat="' + n.cat + '" role="button" tabindex="0" aria-label="' +
        (n.unread ? '未读,' : '') + n.title + '">' +
          dot +
          '<div class="nt-body">' +
            '<div class="nt-row1">' +
              '<h3 class="nt-title">' + n.title + '</h3>' +
              tagHtml +
            '</div>' +
            '<p class="nt-summary">' + n.summary + '</p>' +
            '<div class="nt-row1">' +
              '<span class="nt-time">' + n.time + '</span>' +
            '</div>' +
          '</div>' +
          unread +
        '</article>'
      );
    }

    /* ── Tab 切换 ── */
    document.querySelectorAll('.nt-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.nt-tab').forEach(function (t) {
          t.classList.remove('is-active');
          t.setAttribute('aria-selected', 'false');
        });
        tab.classList.add('is-active');
        tab.setAttribute('aria-selected', 'true');
        state.tab = tab.getAttribute('data-tab');
        render();
      });
    });

    /* ── 一键已读 ── */
    document.getElementById('nt-mark-all').addEventListener('click', function () {
      if (NOTIFICATIONS.every(function (n) { return !n.unread; })) return;
      NOTIFICATIONS.forEach(function (n) { n.unread = false; });
      render();
      // 视觉反馈
      var btn = document.getElementById('nt-mark-all');
      btn.textContent = '已全部已读';
      btn.style.color = 'var(--color-text-disabled)';
      setTimeout(function () {
        btn.style.color = '';
      }, 1400);
    });

    /* ── 卡片点击 → 跳 T05(此处只给视觉反馈) ── */
    document.getElementById('nt-list').addEventListener('click', function (e) {
      var card = e.target.closest('.nt-card');
      if (!card) return;
      var id = card.getAttribute('data-id');
      var n = NOTIFICATIONS.find(function (x) { return x.id === id; });
      if (n && n.unread) {
        n.unread = false;
        render();
      }
      // 占位:T05 跳转由主线程串入
    });

    /* ── 初始化 ── */
    render();
  </script>
</body>
</html>
