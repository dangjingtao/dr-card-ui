    <style>
      body { background: var(--com-neutral-900); color: var(--com-text-primary); font-family: var(--font-family-base); }
      [data-icon] { display:inline-flex; align-items:center; justify-content:center; background-color: currentColor; }

      .scan-shell { max-width: 448px; margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; }
      .scan-statusbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; color: var(--com-neutral-0); font: 600 14px/20px var(--font-family-base); }
      .scan-statusbar .right { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; font-size: 12px; opacity: 0.8; }
      .scan-statusbar .lucide { width: 14px; height: 14px; }

      .scan-stage { flex: 1; position: relative; overflow: hidden; }
      .scan-camera { position: absolute; inset: 0; background:
        radial-gradient(120% 80% at 50% 30%, #1f2532 0%, #0b0e15 60%, #05070c 100%);
      }
      .scan-noise { position: absolute; inset: 0; opacity: 0.18; background:
        repeating-linear-gradient( 0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px),
        repeating-linear-gradient( 90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
        mix-blend-mode: screen;
      }
      .scan-corner { position: absolute; width: 32px; height: 32px; border: 3px solid var(--com-success-500, #21B66F); }
      .scan-corner.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
      .scan-corner.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
      .scan-corner.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
      .scan-corner.br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
      .scan-line { position: absolute; left: 12px; right: 12px; height: 2px; background: linear-gradient(90deg, transparent, var(--com-success-500, #21B66F), transparent); box-shadow: 0 0 18px rgba(33,182,111,0.6); animation: scan-move 2.4s var(--motion-easing-standard) infinite; }
      @keyframes scan-move { 0% { top: 12px; opacity: 0.0; } 10% { opacity: 1; } 50% { top: calc(100% - 14px); } 60% { opacity: 1; } 100% { top: 12px; opacity: 0; } }

      .scan-frame-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; }
      .scan-frame { position: relative; width: min(78vw, 280px); aspect-ratio: 1 / 1; }
      .scan-frame::before, .scan-frame::after { content: ''; position: absolute; inset: 0; border-radius: 20px; }
      .scan-frame::before { background: rgba(0,0,0,0.55); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; padding: 1px; }

      .scan-prompt { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; color: var(--com-neutral-0); }
      .scan-prompt-title { font: 600 16px/24px var(--font-family-base); }
      .scan-prompt-sub { font: 400 12px/18px var(--font-family-base); color: rgba(255,255,255,0.7); margin-top: 4px; }

      .scan-tip { position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,0.42); color: var(--com-neutral-0); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .scan-tip .lucide { width: 16px; height: 16px; color: var(--com-premium-400, #FBBF24); flex: 0 0 16px; }
      .scan-tip-text { font: 400 12px/18px var(--font-family-base); }
    </style>
</head>
<body>
    <div class="scan-shell" data-dom-id="interaction-id-bdt5ams">
        <!-- Status bar (mocked) -->
        <div class="scan-statusbar" aria-hidden="true">
            <span>9:41</span>
            <span class="right">
                <i data-lucide="signal"></i>
                <i data-lucide="wifi"></i>
                <i data-lucide="battery-full"></i>
            </span>
        </div>

        <!-- Stage: scan camera + frame + prompt -->
        <main class="scan-stage">
            <div class="scan-camera" aria-hidden="true"></div>
            <div class="scan-noise" aria-hidden="true"></div>

            <div class="scan-tip" role="status">
                <i data-lucide="scan-line"></i>
                <span class="scan-tip-text">将二维码 / 条形码对准扫描框，自动识别</span>
            </div>

            <div class="scan-frame-wrap">
                <div class="scan-frame" id="scan-frame">
                    <span class="scan-corner tl"></span>
                    <span class="scan-corner tr"></span>
                    <span class="scan-corner bl"></span>
                    <span class="scan-corner br"></span>
                    <span class="scan-line"></span>
                </div>
            </div>

            <div class="scan-prompt">
                <div class="scan-prompt-title">请将二维码对准扫描框</div>
                <div class="scan-prompt-sub">扫码后自动核销</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script><div class="app-tabbar-spacer" aria-hidden="true"></div>
    <script>lucide.createIcons();</script>







<!-- 公共底部 TabBar · 内联版(5 项,扫码 FAB 凸起) -->
<style>
/* 公共底部 TabBar · 内联版(5 项,中间扫码凸起) */
.app-tabbar-spacer { height: 84px; }
.app-tabbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 100; display: flex; align-items: stretch; justify-content: space-around;
  background: #FFFFFF; border-top: 1px solid #E8D9B8;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  box-shadow: 0 -2px 8px rgba(89, 55, 15, 0.04);
}
.app-tabbar-item {
  flex: 1 1 0; display: inline-flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  padding: 4px 0; text-decoration: none; color: var(--color-text-tertiary, #8590A3);
  font: 500 11px/14px var(--font-family-base, -apple-system, sans-serif);
  cursor: pointer; border: 0; background: transparent;
  transition: color 120ms ease, transform 120ms ease;
}
.app-tabbar-item:active { transform: scale(0.96); }
.app-tabbar-item .lucide { width: 22px; height: 22px; color: inherit; }
.app-tabbar-item.is-active { color: var(--color-reward-strong, #B5793B); }
.app-tabbar-item.is-active .lucide { stroke-width: 2.4; }

/* 中间扫码项 · 凸起 FAB 风格 */
.app-tabbar-item.is-fab {
  position: relative;
  flex: 0 0 64px;
  margin: 0 4px;
}
.app-tabbar-item.is-fab .fab-bubble {
  position: absolute;
  left: 50%;
  top: -22px;
  transform: translateX(-50%);
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(180deg, #F4C77B 0%, #B5793B 100%);
  display: flex; align-items: center; justify-content: center;
  color: #FFFFFF;
  box-shadow: 0 6px 14px rgba(181, 121, 59, 0.35), 0 0 0 4px #FFFFFF inset;
  border: 2px solid #FFFFFF;
}
.app-tabbar-item.is-fab .fab-bubble .lucide { width: 26px; height: 26px; color: #FFFFFF; stroke-width: 2.2; }
.app-tabbar-item.is-fab .app-tabbar-label { color: var(--color-reward-strong, #B5793B); font-weight: 600; }
.app-tabbar-item.is-fab.is-active .fab-bubble {
  background: linear-gradient(180deg, #F8D49A 0%, #C58B45 100%);
}
</style>


<script>
(function(){
  function boot(){
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setTimeout(boot, 50);
})();
</script>

</body>
