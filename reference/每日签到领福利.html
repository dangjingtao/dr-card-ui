        display: flex;

        align-items: center;
        gap: 6px;

      .ck-day-label {
        font-size: 11px;
        color: var(--ck-muted);
      }
      .ck-day-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
      }
      .ck-day-circle.completed {
        background: var(--ck-primary);
        color: var(--ck-inverse);
      }
      .ck-day-circle.future {
        background: transparent;
        border: 1.5px solid var(--ck-border);
        color: var(--ck-muted);
      }
      .ck-day-circle.bonus {
        background: var(--ck-primary);
        color: var(--ck-inverse);
      }
      .ck-day-reward {
        font-size: 11px;
        color: var(--ck-primary);
        font-weight: 600;
      }
      .ck-day-reward.muted {
        color: var(--ck-muted);
      }

      .ck-task-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--ck-border);
      }
      .ck-task-item:last-child {
        border-bottom: none;
      }
      .ck-task-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--ck-surface-subtle);

      .ck-task-content {

        font-weight: 600;

      .ck-task-desc {

        color: var(--ck-primary);
        font-size: 12px;
        font-weight: 500;
        background: transparent;
        flex-shrink: 0;

            if(changed){sheets[si].deleteRule(r);sheets[si].insertRule(nt,r);}
          }
        }
      }catch(e){}
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',apply);}
  else{apply();}
})();
