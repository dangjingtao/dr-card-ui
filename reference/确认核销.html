    <script>
        (function () {
            try { if (window.lucide) window.lucide.createIcons(); } catch (e) {}

            var closeBtn = document.getElementById('redeem-close');
            var cancelBtn = document.getElementById('redeem-cancel');
            var confirmBtn = document.getElementById('redeem-confirm');
            var toast = document.getElementById('redeem-toast');
            var serialEl = document.getElementById('redeem-serial');
            var timeEl = document.getElementById('redeem-time');
            var paid = false;

            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            function nowParts(d) {
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }
            function makeSerial(d) {
                var s = 'RR' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
                var tail = Math.floor(Math.random() * 9000 + 1000);
                return s + tail;
            }
            function showToast(text) {
                if (!toast) return;
                var t = toast.querySelector('.redeem-toast-text');
                if (t) t.textContent = text;
                toast.classList.add('show');
                clearTimeout(window.__redeemToastT);
                window.__redeemToastT = setTimeout(function () { toast.classList.remove('show'); }, 1800);
            }
            function goBack() {
                if (document.referrer) { history.back(); }
                else { location.href = '卡包.html'; }
            }

            if (timeEl) timeEl.textContent = nowParts(new Date());
            if (closeBtn) closeBtn.addEventListener('click', goBack);
            if (cancelBtn) cancelBtn.addEventListener('click', goBack);
            if (confirmBtn) {
                confirmBtn.addEventListener('click', function () {
                    if (paid) { goBack(); return; }
                    paid = true;
                    var d = new Date();
                    if (serialEl) serialEl.textContent = makeSerial(d);
                    if (timeEl) timeEl.textContent = nowParts(d);
                    confirmBtn.textContent = '已核销 · 返回';
                    showToast('核销成功');
                });
            }
        })();
    </script>
