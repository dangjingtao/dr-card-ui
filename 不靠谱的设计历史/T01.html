<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完善信息 · 卡博士诗得丽</title>
  <link rel="stylesheet" href="T01.assets/design-system/colors_and_type.css">
  <link rel="stylesheet" href="T01.assets/design-system/components.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       T01 · 完善信息 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:Mockplus 原型(暖白主调 + 暖金主按钮) + 画布(圆角 8/12/16/20)
       ════════════════════════════════════════════════════════════ */

    :root {
      /* root 中只继承 Design Library 的 token;本页不重定义任何颜色 */
    }

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: 812px;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 外层灰底预览(供桌面查看) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: 812px;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 40px;
      box-sizing: border-box;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: 600 18px/24px var(--font-family-base);
      color: var(--color-text-primary);
      text-align: center;
    }
    .ps-topbar .spacer { width: 24px; height: 24px; }

    /* ════════════════════════════════════════════════════════════
       Ambient 光斑(暖金 + 品牌橙,绝对定位铺在最底层)
       ════════════════════════════════════════════════════════════ */
    .me-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .me-ambient > span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(28px);
    }
    .me-amb-warm {
      width: 280px; height: 280px;
      left: -80px; top: 80px;
      background: var(--com-premium-200);
      opacity: 0.65;
    }
    .me-amb-brand-1 {
      width: 220px; height: 220px;
      right: -60px; top: 280px;
      background: var(--com-premium-300);
      opacity: 0.45;
    }
    .me-amb-brand-2 {
      width: 200px; height: 200px;
      right: -40px; bottom: 100px;
      background: var(--com-brand-200);
      opacity: 0.40;
    }

    .ps-topbar,
    .pf-card,
    .pf-submit-wrap { position: relative; z-index: 1; }

    /* ════════════════════════════════════════════════════════════
       主体卡片 · 暖白长卡(头部头像 + 表单字段)
       ════════════════════════════════════════════════════════════ */
    .pf-card {
      margin: 4px 16px 0;
      background: var(--color-surface);
      border-radius: 20px;
      padding: 16px 16px 16px;
      box-shadow: 0 4px 16px -4px rgba(89, 55, 15, 0.08);
    }

    /* ── 头部:头像上传(圆形 64,虚线框) ── */
    .pf-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 0 12px;
    }
    .pf-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px dashed var(--com-brand-100);
      background: var(--com-warm-50);
      color: var(--color-text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 120ms ease, background 120ms ease;
    }
    .pf-avatar:hover,
    .pf-avatar:active {
      border-color: var(--com-brand-500);
      background: var(--com-brand-50);
    }
    .pf-avatar .icon { width: 24px; height: 24px; color: var(--com-brand-500); stroke-width: 2; }
    .pf-avatar .plus {
      font: 600 28px/1 var(--font-family-base);
      color: var(--com-brand-500);
      line-height: 1;
    }
    .pf-avatar-hint {
      font: 500 12px/16px var(--font-family-base);
      color: var(--color-text-tertiary);
      letter-spacing: 0.04em;
    }

    /* ════════════════════════════════════════════════════════════
       表单字段
       ════════════════════════════════════════════════════════════ */
    .pf-fields {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pf-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pf-label {
      font: 500 13px/18px var(--font-family-base);
      color: var(--color-text-secondary);
      padding-left: 2px;
    }
    .pf-label .req { color: var(--com-danger-500); margin-left: 2px; }

    /* ── Input(昵称 / 生日) ── */
    .pf-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      background: var(--color-surface-subtle);
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--color-text-primary);
      font: var(--type-body);
      outline: none;
      box-sizing: border-box;
      transition: border-color 120ms ease, background 120ms ease;
      display: flex;
      align-items: center;
    }
    .pf-input input {
      flex: 1;
      border: 0;
      background: transparent;
      font: var(--type-body);
      color: var(--color-text-primary);
      outline: none;
      min-width: 0;
    }
    .pf-input input::placeholder { color: var(--color-text-placeholder); }
    .pf-input .pf-icon { width: 18px; height: 18px; color: var(--color-text-tertiary); flex: 0 0 auto; }
    .pf-input:focus-within {
      border-color: var(--com-brand-500);
      background: var(--color-surface);
    }

    /* ── Radio card(身份 / 性别) ── */
    .pf-radios {
      display: flex;
      gap: 10px;
    }
    .pf-radio {
      flex: 1;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--color-surface-subtle);
      border: 2px solid transparent;
      border-radius: 12px;
      color: var(--color-text-primary);
      font: 500 15px/20px var(--font-family-base);
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
      box-sizing: border-box;
    }
    .pf-radio:hover { background: var(--com-warm-50); }
    .pf-radio.is-checked {
      border-color: var(--com-brand-500);
      background: var(--com-brand-50);
      color: var(--com-brand-600);
    }
    .pf-radio .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--com-neutral-400);
      flex: 0 0 auto;
      box-sizing: border-box;
      position: relative;
    }
    .pf-radio.is-checked .dot {
      border-color: var(--com-brand-500);
    }
    .pf-radio.is-checked .dot::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--com-brand-500);
    }

    /* ── 6 位消费密码方块 ── */
    .pf-pin {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      outline: none;
    }
    .pf-pin:focus { outline: none; }
    .pf-pin-cell {
      height: 48px;
      width: 100%;
      background: var(--com-warm-50, #FAF6EE);
      border: 1.5px solid var(--com-warm-100, #F0E4CC);
      border-radius: 8px;
      color: var(--color-text-primary);
      font: 600 20px/24px var(--font-family-base);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    .pf-pin-cell.is-filled {
      background: var(--color-surface, #FFFFFF);
      border-color: var(--com-premium-200, #E5C892);
    }
    .pf-pin-cell.is-focus {
      border-color: var(--com-brand-500, #D63D10);
      background: var(--com-brand-50, #FEF1EC);
    }
    .pf-pin-cell .caret {
      display: block;
      width: 1.5px;
      height: 18px;
      background: var(--com-brand-500);
      animation: caret-blink 1s steps(2, start) infinite;
    }
    @keyframes caret-blink { to { visibility: hidden; } }

    /* ── 字段说明文字(密码下方) ── */
    .pf-helper {
      font: 400 12px/16px var(--font-family-base);
      color: var(--color-text-tertiary);
      padding-left: 2px;
    }

    /* ════════════════════════════════════════════════════════════
       底部主按钮(悬浮在卡片下方,主按钮 48 圆角 24 品牌主色)
       ════════════════════════════════════════════════════════════ */
    .pf-submit-wrap {
      margin: 20px 16px 0;
    }
    .pf-submit {
      width: 100%;
      max-width: 343px;
      margin: 0 auto;
      height: 48px;
      border-radius: 24px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font: 600 16px/24px var(--font-family-base);
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 120ms ease, transform 120ms ease;
      box-shadow: 0 4px 12px -2px rgba(214, 61, 16, 0.25);
    }
    .pf-submit:hover { background: var(--color-primary-hover); }
    .pf-submit:active { transform: scale(0.99); }
    .pf-submit .icon { width: 18px; height: 18px; }

    /* 底部安全区 */
    .pf-safe-bottom { height: 24px; }
  </style>
</head>
<body>
  <main class="app-container" data-page-id="page-完善信息">
    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="right">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h2c1 0 1.5-.5 2-1.5l3-7c.5-1 1-1.5 2-1.5h2c1 0 1.5.5 2 1.5l3 7c.5 1 1 1.5 2 1.5h2"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/></svg>
      </span>
    </div>

    <!-- Top bar -->
    <header class="ps-topbar">
      <button type="button" class="icon-btn" aria-label="返回">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>完善信息</h1>
      <span class="spacer" aria-hidden="true"></span>
    </header>

    <!-- Ambient 光斑 -->
    <div class="me-ambient" aria-hidden="true">
      <span class="me-amb-warm"></span>
      <span class="me-amb-brand-1"></span>
      <span class="me-amb-brand-2"></span>
    </div>

    <!-- ══════════ 主体卡片(头像 + 5 个字段) ══════════ -->
    <section class="pf-card" aria-label="完善个人信息">

      <!-- 头像上传 -->
      <div class="pf-head">
        <button type="button" class="pf-avatar" aria-label="上传头像">
          <span class="plus" aria-hidden="true">+</span>
        </button>
        <span class="pf-avatar-hint">点击上传头像</span>
      </div>

      <!-- 字段组 -->
      <div class="pf-fields">

        <!-- 昵称 -->
        <div class="pf-field">
          <label class="pf-label" for="pf-nick">昵称<span class="req">*</span></label>
          <div class="pf-input">
            <input id="pf-nick" type="text" placeholder="请输入昵称" maxlength="20">
          </div>
        </div>

        <!-- 生日 -->
        <div class="pf-field">
          <label class="pf-label" for="pf-birth">生日</label>
          <div class="pf-input">
            <input id="pf-birth" type="text" placeholder="请选择生日" readonly>
            <svg class="pf-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
        </div>

        <!-- 身份(单选) -->
        <div class="pf-field">
          <span class="pf-label">身份</span>
          <div class="pf-radios" role="radiogroup" aria-label="身份">
            <button type="button" class="pf-radio is-checked" role="radio" aria-checked="true" data-value="学生">
              <span class="dot" aria-hidden="true"></span>
              <span>学生</span>
            </button>
            <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="职场">
              <span class="dot" aria-hidden="true"></span>
              <span>职场</span>
            </button>
          </div>
        </div>

        <!-- 性别(单选) -->
        <div class="pf-field">
          <span class="pf-label">性别</span>
          <div class="pf-radios" role="radiogroup" aria-label="性别">
            <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="男">
              <span class="dot" aria-hidden="true"></span>
              <span>男</span>
            </button>
            <button type="button" class="pf-radio" role="radio" aria-checked="false" data-value="女">
              <span class="dot" aria-hidden="true"></span>
              <span>女</span>
            </button>
          </div>
        </div>

        <!-- 消费密码(6 位) -->
        <div class="pf-field">
          <label class="pf-label" for="pf-pin">消费密码<span class="req">*</span></label>
          <div class="pf-pin" id="pf-pin" role="group" aria-label="6 位消费密码" tabindex="0" inputmode="numeric">
            <span class="pf-pin-cell is-focus" data-index="0"><span class="caret" aria-hidden="true"></span></span>
            <span class="pf-pin-cell" data-index="1"></span>
            <span class="pf-pin-cell" data-index="2"></span>
            <span class="pf-pin-cell" data-index="3"></span>
            <span class="pf-pin-cell" data-index="4"></span>
            <span class="pf-pin-cell" data-index="5"></span>
          </div>
          <span class="pf-helper">6 位数字 · 用于门店消费核验</span>
        </div>

      </div>
    </section>

    <!-- 底部主按钮 -->
    <div class="pf-submit-wrap">
      <button type="button" class="pf-submit" id="pf-submit">
        <span>确认信息</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="pf-safe-bottom" aria-hidden="true"></div>
  </main>

  <script>
    /* ── Radio 切换 ── */
    document.querySelectorAll('.pf-radios').forEach(function (group) {
      group.addEventListener('click', function (e) {
        var btn = e.target.closest('.pf-radio');
        if (!btn) return;
        group.querySelectorAll('.pf-radio').forEach(function (b) {
          b.classList.remove('is-checked');
          b.setAttribute('aria-checked', 'false');
        });
        btn.classList.add('is-checked');
        btn.setAttribute('aria-checked', 'true');
      });
    });

    /* ── 6 位密码:容器 focus 即可,直接监听全局 keydown ── */
    var pin = document.getElementById('pf-pin');
    var cells = pin.querySelectorAll('.pf-pin-cell');
    var value = '';
    var pinLocked = false; // 6 位填满后锁定

    function renderPin() {
      var len = value.length;
      cells.forEach(function (cell, i) {
        cell.classList.remove('is-filled', 'is-focus');
        cell.innerHTML = '';
        if (i < len) {
          cell.classList.add('is-filled');
          cell.textContent = '•';
        }
      });
      if (len < 6) {
        cells[len].classList.add('is-focus');
        cells[len].innerHTML = '<span class="caret" aria-hidden="true"></span>';
      }
    }

    function pinHandleKey(e) {
      if (pinLocked) return;
      if (/^[0-9]$/.test(e.key)) {
        if (value.length < 6) {
          value += e.key;
          renderPin();
          e.preventDefault();
        }
      } else if (e.key === 'Backspace') {
        if (value.length > 0) {
          value = value.slice(0, -1);
          renderPin();
          e.preventDefault();
        }
      }
    }

    // 点方块 → 让 pin 容器获得焦点 → 后续键盘事件落到 pinHandleKey
    pin.addEventListener('click', function () { pin.focus(); });
    pin.addEventListener('keydown', pinHandleKey);
    // 全局兜底:如果 pin 已 focus,document 上也响应(避免部分浏览器不冒泡)
    document.addEventListener('keydown', function (e) {
      if (document.activeElement === pin) pinHandleKey(e);
    });

    /* ── 主按钮:模拟「确认信息」提交,触发 P3 弹层占位 ── */
    document.getElementById('pf-submit').addEventListener('click', function () {
      // 占位:实际由主线程串入 popup-填写完成后领取成功
      // 此处仅给视觉反馈,5 字段全部填写后才允许点击
      var nick = document.getElementById('pf-nick').value.trim();
      if (!nick) { document.getElementById('pf-nick').focus(); return; }
      if (value.length < 6) { pin.focus(); return; }
      // 占位:成功反馈(不跳页,符合任务卡 §7 验收)
      var btn = document.getElementById('pf-submit');
      btn.style.background = 'var(--com-success-500, #22C55E)';
      btn.querySelector('span').textContent = '已确认';
      setTimeout(function () {
        btn.style.background = '';
        btn.querySelector('span').textContent = '确认信息';
      }, 1200);
    });

    /* ── 初始化:渲染空态(第 1 格为默认焦点) ── */
    renderPin();
  </script>
</body>
</html>
