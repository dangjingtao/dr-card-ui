<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>品牌福利官 · 卡博士诗得丽</title>
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/components.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       T08 · 品牌福利官 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:Mockplus 原型(白底 + 暖金) + 画布(圆角 8/12/16/20)
       ════════════════════════════════════════════════════════════ */

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: 812px;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 外层灰底预览(供桌面查看) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: 812px;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题 + 右上无) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 44px;
      box-sizing: border-box;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: 600 18px/24px var(--font-family-base);
      color: var(--color-text-primary);
      text-align: center;
    }
    .ps-topbar .spacer { width: 24px; height: 24px; }

    /* ════════════════════════════════════════════════════════════
       Ambient 光斑(暖金,绝对定位铺在最底层)
       ════════════════════════════════════════════════════════════ */
    .bw-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bw-ambient > span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(28px);
    }
    .bw-amb-warm {
      width: 240px; height: 240px;
      right: -60px; top: 60px;
      background: var(--com-premium-200);
      opacity: 0.55;
    }
    .bw-amb-gold {
      width: 220px; height: 220px;
      left: -60px; top: 220px;
      background: var(--com-premium-300);
      opacity: 0.40;
    }
    .bw-amb-soft {
      width: 200px; height: 200px;
      right: -50px; top: 420px;
      background: var(--com-brand-100);
      opacity: 0.32;
    }

    .ps-topbar,
    .bw-header,
    .bw-person,
    .bw-services { position: relative; z-index: 1; }

    /* ════════════════════════════════════════════════════════════
       头部 · 话术 + 企微二维码(200×200 居中)
       ════════════════════════════════════════════════════════════ */
    .bw-header {
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .bw-head-text {
      font: var(--type-body);
      color: var(--color-text-primary);
      text-align: center;
      line-height: var(--line-height-body);
      max-width: 280px;
    }

    .bw-qr {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-lg);
      background: var(--com-neutral-100);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px -6px rgba(89, 55, 15, 0.14);
      border: 1px solid var(--color-border-subtle);
      box-sizing: border-box;
      flex-direction: column;
      gap: 6px;
      color: var(--color-text-tertiary);
    }
    .bw-qr .qr-grid {
      width: 120px;
      height: 120px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px;
    }
    .bw-qr .qr-grid i {
      background: var(--com-neutral-500);
      display: block;
      border-radius: 1px;
      opacity: 0.55;
    }
    .bw-qr .qr-grid i.on { opacity: 0.85; }
    .bw-qr .qr-label {
      font: var(--type-label);
      color: var(--color-text-tertiary);
      letter-spacing: 0.04em;
    }
    .bw-qr-tip {
      font: var(--type-caption);
      color: var(--color-text-tertiary);
      text-align: center;
    }
    .bw-qr-caption {
      font: 500 12px/18px var(--font-family-base);
      color: var(--color-text-secondary);
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* ════════════════════════════════════════════════════════════
       人员信息卡片(头像 48 + 姓名 16 + 简介 14,居中)
       ════════════════════════════════════════════════════════════ */
    .bw-person {
      margin: 4px 16px 0;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 16px 16px;
      box-shadow: 0 4px 16px -8px rgba(89, 55, 15, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bw-person .avatar {
      width: var(--com-size-48);
      height: var(--com-size-48);
      background: var(--com-warm-100);
      color: var(--com-premium-600);
      font: 600 18px/24px var(--font-family-base);
    }
    .bw-person .name {
      font: 600 16px/22px var(--font-family-base);
      color: var(--color-text-primary);
    }
    .bw-person .bio {
      font: 400 14px/20px var(--font-family-base);
      color: var(--color-text-secondary);
      text-align: center;
      max-width: 260px;
    }

    /* ════════════════════════════════════════════════════════════
       服务列表(3-4 条卡片 · 圆角 12 · icon + 标题 + 副文案)
       ════════════════════════════════════════════════════════════ */
    .bw-services {
      margin: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bw-services-title {
      font: 500 13px/18px var(--font-family-base);
      color: var(--color-text-tertiary);
      padding-left: 4px;
      letter-spacing: 0.04em;
    }
    .bw-service {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: 0 2px 8px -6px rgba(89, 55, 15, 0.08);
      border: 1px solid transparent;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      cursor: pointer;
    }
    .bw-service:hover,
    .bw-service:active {
      background: var(--com-brand-50);
      border-color: var(--com-brand-100);
    }
    .bw-service .icon-bubble {
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: var(--com-warm-100);
      color: var(--com-premium-600);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      font: 600 14px/20px var(--font-family-base);
    }
    .bw-service .text {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .bw-service .title {
      font: 600 16px/22px var(--font-family-base);
      color: var(--color-text-primary);
    }
    .bw-service .sub {
      font: 400 14px/20px var(--font-family-base);
      color: var(--color-text-secondary);
    }
    .bw-service .chev {
      width: var(--com-icon-size-md);
      height: var(--com-icon-size-md);
      color: var(--color-text-tertiary);
      flex: 0 0 auto;
    }

    /* 底部安全区 */
    .bw-safe-bottom { height: 24px; }
  </style>
</head>
<body>
  <main class="app-container" data-page-id="page-品牌福利官">
    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="right">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h2c1 0 1.5-.5 2-1.5l3-7c.5-1 1-1.5 2-1.5h2c1 0 1.5.5 2 1.5l3 7c.5 1 1 1.5 2 1.5h2"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/></svg>
      </span>
    </div>

    <!-- Top bar -->
    <header class="ps-topbar">
      <button type="button" class="icon-btn" aria-label="返回">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>品牌福利官</h1>
      <span class="spacer" aria-hidden="true"></span>
    </header>

    <!-- Ambient 光斑 -->
    <div class="bw-ambient" aria-hidden="true">
      <span class="bw-amb-warm"></span>
      <span class="bw-amb-gold"></span>
      <span class="bw-amb-soft"></span>
    </div>

    <!-- ══════════ 头部 · 话术 + 二维码占位 ══════════ -->
    <section class="bw-header" aria-label="企微福利官">
      <p class="bw-head-text">请添加我们的企业微信福利官<br>获取更多福利咨询</p>
      <div class="bw-qr" role="img" aria-label="企业微信二维码占位">
        <div class="qr-grid" aria-hidden="true">
          <i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i>
          <i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i>
          <i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i>
          <i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i><i></i>
          <i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i>
          <i></i><i class="on"></i><i></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i>
          <i class="on"></i><i></i><i class="on"></i><i></i><i></i><i></i><i class="on"></i><i class="on"></i>
          <i></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i class="on"></i>
        </div>
        <span class="qr-label">QR Placeholder</span>
      </div>
      <p class="bw-qr-caption">诗得丽品牌福利官 · 吴哥</p>
      <p class="bw-qr-tip">长按或扫描识别二维码,添加企业微信</p>
    </section>

    <!-- ══════════ 人员信息卡片 ══════════ -->
    <section class="bw-person" aria-label="福利官信息">
      <span class="avatar" aria-hidden="true">吴</span>
      <span class="name">吴哥 · 品牌福利官</span>
      <span class="bio">专属会员服务 · 第一时间推送福利与活动</span>
    </section>

    <!-- ══════════ 服务列表 ══════════ -->
    <section class="bw-services" aria-label="添加后可享受的服务">
      <span class="bw-services-title">添加福利官后,可享受</span>

      <button type="button" class="bw-service" aria-label="每日签到提醒">
        <span class="icon-bubble" aria-hidden="true">签</span>
        <span class="text">
          <span class="title">每日签到提醒</span>
          <span class="sub">每日 09:00 推送,不错过泡泡值</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button type="button" class="bw-service" aria-label="会员专享福利">
        <span class="icon-bubble" aria-hidden="true">惠</span>
        <span class="text">
          <span class="title">会员专享福利</span>
          <span class="sub">限定折扣、专属券、限量名额优先发</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button type="button" class="bw-service" aria-label="新品体验优先购">
        <span class="icon-bubble" aria-hidden="true">新</span>
        <span class="text">
          <span class="title">新品体验优先购</span>
          <span class="sub">新品上架提前 24h 通知,优先发货</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <button type="button" class="bw-service" aria-label="节日活动预告">
        <span class="icon-bubble" aria-hidden="true">节</span>
        <span class="text">
          <span class="title">节日活动预告</span>
          <span class="sub">节日限定礼包、抽奖活动实时通知</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </section>

    <div class="bw-safe-bottom" aria-hidden="true"></div>
  </main>
</body>
</html>
