<!DOCTYPE html>
<html lang="zh-CN" class="light theme-premium-gold" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>泡泡值明细 · 卡博士诗得丽</title>
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/components.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       T02 · 泡泡值明细 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:Mockplus 原型(暖金 + 暖白) → 画布 token 落地
       原型紫色 → --com-brand-500 暖橙 + --com-premium-500 金的组合
       原型 IP 北极熊 → --com-warm-100 灰色剪影块装饰
       ════════════════════════════════════════════════════════════ */

    :root {
      /* root 中只继承 Design Library 的 token;本页不重定义任何颜色 */
    }

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: 812px;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      padding-bottom: 0;
    }

    /* 外层灰底预览(供桌面查看) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: 812px;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 40px;
      box-sizing: border-box;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-pill);
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: var(--type-heading);
      color: var(--color-text-primary);
      text-align: center;
    }
    .ps-topbar .spacer { width: 24px; height: 24px; }

    /* ════════════════════════════════════════════════════════════
       Ambient 光斑(暖金 + 品牌橙,绝对定位铺在最底层)
       ════════════════════════════════════════════════════════════ */
    .pd-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .pd-ambient > span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(28px);
    }
    .pd-amb-warm {
      width: 280px; height: 280px;
      left: -80px; top: 60px;
      background: var(--com-premium-200);
      opacity: 0.55;
    }
    .pd-amb-brand {
      width: 220px; height: 220px;
      right: -60px; top: 200px;
      background: var(--com-premium-300);
      opacity: 0.40;
    }

    .ps-topbar,
    .pd-balance,
    .pd-bear,
    .pd-section,
    .pd-submit-wrap { position: relative; z-index: 1; }

    /* ════════════════════════════════════════════════════════════
       余额胶囊(背景 premium-50 圆角 16;数字 36 粗体 premium-700)
       ════════════════════════════════════════════════════════════ */
    .pd-balance {
      margin: 8px 16px 16px;
      background: var(--com-premium-50);
      border-radius: var(--com-radius-16);
      padding: 20px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px -2px rgba(89, 55, 15, 0.08);
      position: relative;
      overflow: hidden;
    }
    /* 余额胶囊内的极淡装饰横线(暖金光泽) */
    .pd-balance::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: var(--com-premium-100);
      opacity: 0.6;
    }
    .pd-balance-label {
      font: 500 12px/16px var(--font-family-base);
      color: var(--com-premium-600);
      letter-spacing: 0.04em;
    }
    .pd-balance-value {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
      color: var(--com-premium-700);
      font: 700 36px/42px var(--font-family-base);
      letter-spacing: -0.01em;
    }
    .pd-balance-value .unit {
      font: 600 14px/20px var(--font-family-base);
      color: var(--com-premium-600);
      margin-left: 2px;
    }
    .pd-balance-sub {
      font: 400 11px/16px var(--font-family-base);
      color: var(--com-premium-600);
      opacity: 0.7;
    }

    /* ════════════════════════════════════════════════════════════
       北极熊剪影装饰块(原型 IP 占位,纯灰色块,非完整 IP)
       ════════════════════════════════════════════════════════════ */
    .pd-bear {
      position: absolute;
      right: 12px;
      top: 14px;
      width: 44px;
      height: 44px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }
    .pd-bear svg { width: 100%; height: 100%; display: block; }

    /* ════════════════════════════════════════════════════════════
       列表区域(分组标题 + 行卡片 12 圆角白底)
       ════════════════════════════════════════════════════════════ */
    .pd-section {
      margin: 4px 16px 16px;
    }
    .pd-section + .pd-section { margin-top: 4px; }
    .pd-section-title {
      font: 600 13px/18px var(--font-family-base);
      color: var(--color-text-tertiary);
      padding: 8px 4px;
      letter-spacing: 0.02em;
    }
    .pd-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pd-row {
      background: var(--color-surface);
      border-radius: var(--com-radius-12);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px -1px rgba(23, 27, 42, 0.04);
      transition: background 120ms ease, transform 120ms ease;
      cursor: pointer;
    }
    .pd-row:hover { background: var(--com-warm-50); }
    .pd-row:active { background: var(--com-warm-100); transform: scale(0.998); }

    /* 类型图标方块(收入金色 / 消耗灰色) */
    .pd-row .pd-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pd-row .pd-icon.income {
      background: var(--com-premium-50);
      color: var(--com-premium-600);
    }
    .pd-row .pd-icon.expense {
      background: var(--com-neutral-100);
      color: var(--com-neutral-600);
    }
    .pd-row .pd-icon svg { width: 20px; height: 20px; stroke-width: 2; }

    .pd-row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pd-row-title {
      font: 500 14px/20px var(--font-family-base);
      color: var(--color-text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pd-row-meta {
      font: 400 12px/16px var(--font-family-base);
      color: var(--color-text-tertiary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pd-row-meta .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--com-neutral-300); }

    /* 积分气泡(收入 premium-500 / 消耗 neutral-500) */
    .pd-bubble {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      height: 26px;
      border-radius: var(--radius-pill);
      font: 600 13px/18px var(--font-family-base);
      letter-spacing: 0.01em;
    }
    .pd-bubble.income {
      background: var(--com-premium-500);
      color: var(--com-neutral-0);
    }
    .pd-bubble.expense {
      background: var(--com-neutral-500);
      color: var(--com-neutral-0);
    }

    /* ════════════════════════════════════════════════════════════
       空态(插画占位 + 文字)
       ════════════════════════════════════════════════════════════ */
    .pd-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 40px 16px 24px;
      text-align: center;
    }
    .pd-empty.is-active { display: flex; }
    .pd-empty-illu {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--com-warm-100);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--com-premium-500);
    }
    .pd-empty-illu svg { width: 48px; height: 48px; stroke-width: 1.6; }
    .pd-empty-title {
      font: 600 15px/22px var(--font-family-base);
      color: var(--color-text-primary);
    }
    .pd-empty-sub {
      font: 400 12px/18px var(--font-family-base);
      color: var(--color-text-tertiary);
    }

    /* ════════════════════════════════════════════════════════════
       底部主按钮(48 圆角 24 品牌主色,悬浮在列表下方)
       ════════════════════════════════════════════════════════════ */
    .pd-submit-wrap {
      margin: 12px 16px 0;
    }
    .pd-submit {
      width: 100%;
      max-width: 343px;
      margin: 0 auto;
      height: 48px;
      border-radius: 24px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font: 600 16px/24px var(--font-family-base);
      border: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 120ms ease, transform 120ms ease;
      box-shadow: 0 4px 12px -2px rgba(214, 61, 16, 0.25);
    }
    .pd-submit:hover { background: var(--color-primary-hover); }
    .pd-submit:active { transform: scale(0.99); }
    .pd-submit .icon { width: 18px; height: 18px; }

    /* 底部安全区 */
    .pd-safe-bottom { height: 24px; }
  </style>
</head>
<body>
  <main class="app-container" data-page-id="page-points-detail">
    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="right">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h2c1 0 1.5-.5 2-1.5l3-7c.5-1 1-1.5 2-1.5h2c1 0 1.5.5 2 1.5l3 7c.5 1 1 1.5 2 1.5h2"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/></svg>
      </span>
    </div>

    <!-- Top bar -->
    <header class="ps-topbar">
      <button type="button" class="icon-btn" aria-label="返回" id="pd-back">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>泡泡值明细</h1>
      <span class="spacer" aria-hidden="true"></span>
    </header>

    <!-- Ambient 光斑 -->
    <div class="pd-ambient" aria-hidden="true">
      <span class="pd-amb-warm"></span>
      <span class="pd-amb-brand"></span>
    </div>

    <!-- ══════════ 余额胶囊(金色 premium-50 底 + 大数字) ══════════ -->
    <section class="pd-balance" aria-label="当前泡泡值">
      <!-- 北极熊剪影装饰(原型 IP 占位) -->
      <span class="pd-bear" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="var(--com-warm-100)">
          <ellipse cx="24" cy="30" rx="14" ry="12"/>
          <circle cx="24" cy="16" r="10"/>
          <circle cx="16" cy="11" r="4"/>
          <circle cx="32" cy="11" r="4"/>
        </svg>
      </span>
      <span class="pd-balance-label">当前泡泡值</span>
      <span class="pd-balance-value">
        2,860<span class="unit">积分</span>
      </span>
      <span class="pd-balance-sub">本月已收入 +320 · 已消耗 180</span>
    </section>

    <!-- ══════════ 列表(15 条 mock 数据,收入/消耗各占部分) ══════════ -->
    <section class="pd-section" id="pd-list-wrap" aria-label="泡泡值变动记录">
      <h2 class="pd-section-title">本月</h2>
      <div class="pd-list" id="pd-list">
        <!-- 行模板 -->
      </div>
    </section>

    <!-- 空态(默认隐藏) -->
    <section class="pd-empty" id="pd-empty" aria-label="空态">
      <div class="pd-empty-illu" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M16 24h16"/><path d="M24 16v16"/></svg>
      </div>
      <p class="pd-empty-title">暂无泡泡值记录</p>
      <p class="pd-empty-sub">完成任务或消费后可获得泡泡值</p>
    </section>

    <!-- 底部主按钮 -->
    <div class="pd-submit-wrap">
      <button type="button" class="pd-submit" id="pd-exchange">
        <span>立即兑换</span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="pd-safe-bottom" aria-hidden="true"></div>
  </main>

  <script>
    /* ── Mock 数据(15 条) ── */
    var rows = [
      { date: '08-12 14:08', type: 'income',  title: '完成每日签到',          sub: '签到福利',     delta: +10 },
      { date: '08-11 19:32', type: 'expense', title: '兑换 · 毛巾快洗 1 次', sub: '洗护兑换专区', delta: -120 },
      { date: '08-10 10:05', type: 'income',  title: '门店消费返积分',        sub: '虹口龙之梦店', delta: +86 },
      { date: '08-09 12:48', type: 'income',  title: '邀请搭子奖励',          sub: '搭子邀请',     delta: +50 },
      { date: '08-08 09:21', type: 'expense', title: '兑换 · 吹风造型',       sub: '洗护兑换专区', delta: -60 },
      { date: '08-07 20:14', type: 'income',  title: '分享品牌福利官',        sub: '分享奖励',     delta: +30 },
      { date: '08-06 15:00', type: 'expense', title: '兑换 · 头皮 SPA',       sub: '洗护兑换专区', delta: -200 },
      { date: '08-05 11:22', type: 'income',  title: '生日月礼包',            sub: '会员福利',     delta: +200 },
      { date: '08-04 18:36', type: 'expense', title: '兑换 · 矿泉水 1 瓶',    sub: '门店福利',     delta: -15 },
      { date: '08-03 09:48', type: 'income',  title: '连续打卡 7 天',          sub: '签到福利',     delta: +80 },
      { date: '08-02 16:09', type: 'expense', title: '兑换 · 浴巾快洗 1 次',  sub: '洗护兑换专区', delta: -90 },
      { date: '08-01 12:00', type: 'income',  title: '新人首单奖励',          sub: '新人福利',     delta: +100 },
      { date: '07-31 20:33', type: 'expense', title: '兑换 · 冷萃咖啡',       sub: '门店福利',     delta: -25 },
      { date: '07-30 10:11', type: 'income',  title: '完成品牌问卷',          sub: '调研奖励',     delta: +40 },
      { date: '07-29 14:50', type: 'expense', title: '兑换 · 茶饮券 1 张',    sub: '门店福利',     delta: -30 }
    ];

    /* ── 图标库(收入 / 消耗) ── */
    var ICONS = {
      income: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
      expense: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>'
    };

    /* ── 渲染列表 ── */
    function renderList() {
      var wrap = document.getElementById('pd-list');
      var html = rows.map(function (r) {
        var sign = r.delta > 0 ? '+' : '−';
        var amount = Math.abs(r.delta);
        var iconCls = r.type === 'income' ? 'income' : 'expense';
        return ''
          + '<div class="pd-row" data-type="' + r.type + '">'
          +   '<span class="pd-icon ' + iconCls + '" aria-hidden="true">' + ICONS[r.type] + '</span>'
          +   '<div class="pd-row-main">'
          +     '<span class="pd-row-title">' + r.title + '</span>'
          +     '<span class="pd-row-meta">'
          +       '<span>' + r.date + '</span>'
          +       '<span class="dot" aria-hidden="true"></span>'
          +       '<span>' + r.sub + '</span>'
          +     '</span>'
          +   '</div>'
          +   '<span class="pd-bubble ' + iconCls + '">' + sign + amount + '</span>'
          + '</div>';
      }).join('');
      wrap.innerHTML = html;
    }

    /* ── 空态切换(供将来主线程串入,本卡仅留接口) ── */
    function showEmpty(empty) {
      document.getElementById('pd-list-wrap').style.display = empty ? 'none' : '';
      var el = document.getElementById('pd-empty');
      el.classList.toggle('is-active', !!empty);
    }

    /* ── 交互:行点击反馈(轻量高亮) ── */
    document.addEventListener('click', function (e) {
      var row = e.target.closest('.pd-row');
      if (!row) return;
      row.style.background = 'var(--com-warm-100)';
      setTimeout(function () { row.style.background = ''; }, 180);
    });

    /* ── 交互:返回占位(任务卡规范:左上返回 → 积分首页,由主线程串入) ── */
    document.getElementById('pd-back').addEventListener('click', function () {
      // 占位:不跳页,符合 T01 范式;弹层由主线程串入
      var btn = this;
      btn.style.background = 'var(--com-neutral-100)';
      setTimeout(function () { btn.style.background = ''; }, 140);
    });

    /* ── 交互:立即兑换(占位:成功反馈) ── */
    document.getElementById('pd-exchange').addEventListener('click', function () {
      var btn = this;
      btn.style.background = 'var(--com-success-500)';
      btn.querySelector('span').textContent = '跳转中…';
      setTimeout(function () {
        btn.style.background = '';
        btn.querySelector('span').textContent = '立即兑换';
      }, 1000);
    });

    /* ── 初始化 ── */
    renderList();
  </script>
</body>
</html>
