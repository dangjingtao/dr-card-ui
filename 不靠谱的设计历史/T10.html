<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人工客服 · 卡博士诗得丽</title>
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/colors_and_type.css">
  <link rel="stylesheet" href="../.design_library/com-design-premium-gold/components.css">
  <style>
    /* ════════════════════════════════════════════════════════════
       T10 · 人工客服排队 (com-design-premium-gold 暖金尊享)
       约束源:com-design-premium-gold Design Library(只读)
       设计语言对齐:Mockplus 原型(白底 + 暖金点缀) + 画布(TopBar / 圆角 8/12/16/20)
       ════════════════════════════════════════════════════════════ */

    /* ── Mobile app shell ── */
    body {
      margin: 0;
      background: var(--color-background);
      color: var(--color-text-primary);
      font: var(--type-body);
      -webkit-font-smoothing: antialiased;
    }
    .app-container {
      width: 100%;
      max-width: 375px;
      min-height: 812px;
      margin: 0 auto;
      background: var(--color-background);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 外层灰底预览(供桌面查看 ≥480px) */
    @media (min-width: 480px) {
      body { background: var(--com-neutral-100); padding: 24px 0; }
      .app-container {
        box-shadow: 0 8px 32px rgba(23, 27, 42, 0.10);
        border-radius: 24px;
        min-height: 812px;
      }
    }

    /* ── Status bar(iOS 风格占位) ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 4px;
      font: 600 14px/1 var(--font-family-base);
      color: var(--color-text-primary);
      flex: 0 0 auto;
    }
    .status-bar .right { display: inline-flex; align-items: center; gap: 6px; }
    .status-bar .icon { width: 16px; height: 16px; color: var(--color-text-primary); }

    /* ── Top bar(返回 + 标题) ── */
    .ps-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 16px 8px;
      height: 40px;
      box-sizing: border-box;
      flex: 0 0 auto;
    }
    .ps-topbar .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      color: var(--color-text-primary);
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 0;
    }
    .ps-topbar .icon-btn .icon { width: 24px; height: 24px; stroke-width: 2.2; }
    .ps-topbar h1 {
      flex: 1;
      margin: 0;
      font: 600 18px/24px var(--font-family-base);
      color: var(--color-text-primary);
      text-align: center;
    }
    .ps-topbar .spacer { width: 24px; height: 24px; }

    /* ════════════════════════════════════════════════════════════
       Ambient 光斑(暖金 + 品牌橙,绝对定位铺在最底层)
       ════════════════════════════════════════════════════════════ */
    .me-ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .me-ambient > span {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(28px);
    }
    .me-amb-warm {
      width: 260px; height: 260px;
      left: -70px; top: 180px;
      background: var(--com-premium-200);
      opacity: 0.55;
    }
    .me-amb-brand-1 {
      width: 220px; height: 220px;
      right: -60px; top: 380px;
      background: var(--com-brand-200);
      opacity: 0.35;
    }

    .ps-topbar,
    .pq-stage,
    .pq-text,
    .pq-action,
    .pq-toast { position: relative; z-index: 1; }

    /* ════════════════════════════════════════════════════════════
       中央内容区(垂直水平居中:插画 + 文案 + 文字按钮)
       ════════════════════════════════════════════════════════════ */
    .pq-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      gap: 24px;
    }

    /* ── 中央插画占位(圆形 200 暖白底) ── */
    .pq-illustration {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: var(--com-warm-100);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px -8px rgba(89, 55, 15, 0.10);
    }
    .pq-illustration .pq-ip-text {
      font: 500 14px/20px var(--font-family-base);
      color: var(--com-neutral-500);
      letter-spacing: 0.06em;
    }
    /* 右上角 8 圆点小角标(brand-500 暖橙) */
    .pq-illustration .pq-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--com-brand-500);
      box-shadow: 0 0 0 4px var(--com-warm-50);
    }

    /* ── 文案:当前排队 X 人 / 预计等待 Y 分钟 ── */
    .pq-text {
      text-align: center;
      font: var(--type-body);
      color: var(--color-text-primary);
      max-width: 280px;
    }
    .pq-text .pq-num {
      color: var(--com-premium-500);
      font: 600 18px/24px var(--font-family-base);
      margin: 0 2px;
    }
    .pq-text .pq-sep {
      display: inline-block;
      width: 1px;
      height: 12px;
      background: var(--com-neutral-300);
      margin: 0 10px;
      vertical-align: middle;
    }

    /* ── 排队序号 mock(顶部小角标) ── */
    .pq-queue-no {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: var(--com-brand-50);
      color: var(--com-brand-600);
      font: 500 12px/16px var(--font-family-base);
      letter-spacing: 0.04em;
    }
    .pq-queue-no .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--com-brand-500);
      animation: pq-blink 1.2s ease-in-out infinite;
    }
    @keyframes pq-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* ── 取消排队 文字按钮(灰色 14) ── */
    .pq-action {
      width: 100%;
      max-width: 343px;
      display: flex;
      justify-content: center;
    }
    .pq-text-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 36px;
      padding: 0 16px;
      background: transparent;
      border: 0;
      color: var(--color-text-tertiary);
      font: 400 14px/20px var(--font-family-base);
      cursor: pointer;
      transition: color 120ms ease;
      border-radius: 8px;
    }
    .pq-text-btn:hover { color: var(--com-neutral-800); }
    .pq-text-btn:active { color: var(--com-brand-500); }

    /* ════════════════════════════════════════════════════════════
       Toast 反馈(底部居中,纯内联,自动消失)
       ════════════════════════════════════════════════════════════ */
    .pq-toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(12px);
      min-width: 120px;
      max-width: 280px;
      padding: 10px 18px;
      background: var(--com-neutral-800);
      color: var(--com-neutral-0);
      font: 500 14px/20px var(--font-family-base);
      border-radius: 12px;
      box-shadow: 0 8px 24px -4px rgba(23, 27, 42, 0.24);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 99;
    }
    .pq-toast.is-show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 底部安全区 */
    .pq-safe-bottom { height: 24px; flex: 0 0 auto; }
  </style>
</head>
<body>
  <main class="app-container" data-page-id="page-人工客服排队">
    <!-- Status bar -->
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="right">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h2c1 0 1.5-.5 2-1.5l3-7c.5-1 1-1.5 2-1.5h2c1 0 1.5.5 2 1.5l3 7c.5 1 1 1.5 2 1.5h2"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="10" x2="6" y2="10.01"/><line x1="10" y1="10" x2="10" y2="10.01"/><line x1="14" y1="10" x2="14" y2="10.01"/></svg>
      </span>
    </div>

    <!-- Top bar -->
    <header class="ps-topbar">
      <button type="button" class="icon-btn" id="pq-back" aria-label="返回">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1>人工客服</h1>
      <span class="spacer" aria-hidden="true"></span>
    </header>

    <!-- Ambient 光斑 -->
    <div class="me-ambient" aria-hidden="true">
      <span class="me-amb-warm"></span>
      <span class="me-amb-brand-1"></span>
    </div>

    <!-- ══════════ 中央内容:排队插画 + 文案 + 文字按钮 ══════════ -->
    <section class="pq-stage" aria-label="排队中">

      <!-- 插画占位(圆形 200) -->
      <div class="pq-illustration" role="img" aria-label="排队插画占位">
        <span class="pq-ip-text">IP 占位</span>
        <span class="pq-badge" aria-hidden="true"></span>
      </div>

      <!-- 排队序号胶囊(mock 实时变化) -->
      <span class="pq-queue-no" id="pq-queue-no" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span>排队中 · 第 <em id="pq-no">2</em> 位</span>
      </span>

      <!-- 文案 16 居中 -->
      <p class="pq-text">
        当前排队 <span class="pq-num" id="pq-count">3</span> 人
        <span class="pq-sep" aria-hidden="true"></span>
        预计等待 <span class="pq-num" id="pq-eta">2</span> 分钟
      </p>

      <!-- 取消排队 文字按钮 -->
      <div class="pq-action">
        <button type="button" class="pq-text-btn" id="pq-cancel">
          取消排队
        </button>
      </div>

    </section>

    <div class="pq-safe-bottom" aria-hidden="true"></div>

    <!-- Toast 占位 -->
    <div class="pq-toast" id="pq-toast" role="status" aria-live="polite">已取消</div>
  </main>

  <script>
    /* ── Toast 工具 ── */
    var toast = document.getElementById('pq-toast');
    var toastTimer = null;
    function showToast(msg, duration) {
      toast.textContent = msg;
      toast.classList.add('is-show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('is-show');
      }, duration || 1200);
    }

    /* ── 模拟排队号 / 等待时间微变化(让 mock 更真实) ── */
    (function tickMock() {
      var countEl = document.getElementById('pq-count');
      var etaEl = document.getElementById('pq-eta');
      var noEl = document.getElementById('pq-no');
      if (!countEl || !etaEl || !noEl) return;
      setInterval(function () {
        var c = parseInt(countEl.textContent, 10) || 3;
        var e = parseInt(etaEl.textContent, 10) || 2;
        var n = parseInt(noEl.textContent, 10) || 2;
        /* 排队号往前走,前面的人减少,等待时间下降(到 0 不再减) */
        if (n > 1) {
          noEl.textContent = String(n - 1);
          if (c > 1) countEl.textContent = String(c - 1);
          if (e > 0) etaEl.textContent = String(e - 1);
        }
      }, 6000);
    })();

    /* ── 「取消排队」点击 → Toast → 回流上一页 ── */
    document.getElementById('pq-cancel').addEventListener('click', function () {
      showToast('已取消', 1200);
      setTimeout(function () {
        /* mock 回流:history 退一步,无历史时跳回 # */
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.hash = '#/智能客服';
        }
      }, 1200);
    });

    /* ── 左上返回 → 直接 mock 回流到智能客服 ── */
    document.getElementById('pq-back').addEventListener('click', function () {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.hash = '#/智能客服';
      }
    });
  </script>
</body>
</html>
